<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#0f1115; --card:#1a1e26; --card2:#232834; --line:#2e3442;
  --text:#eef1f6; --dim:#8b93a3; --accent:#4ade80; --accent-dark:#16a34a;
  --danger:#f87171; --warn:#fbbf24;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}
.topbar .sub{font-size:13px;color:var(--dim);margin-top:2px}
main{padding:14px 14px 150px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:18px}
.hint{font-size:13px;color:var(--dim)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px 16px;
  font-size:17px;font-weight:700;color:var(--text);background:var(--card2);
  cursor:pointer;touch-action:manipulation;margin-top:10px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent-dark);color:#fff}
.btn-ghost{background:transparent;border:1px dashed var(--line);color:var(--dim);font-weight:600}
.btn-danger{background:transparent;border:1px solid var(--line);color:var(--danger)}
.btn-sm{display:inline-block;width:auto;padding:9px 14px;font-size:15px;margin:0}
.row{display:flex;gap:8px;align-items:center}
.row .grow{flex:1}
.tpl-btn{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:8px}
.tpl-btn .hint{font-weight:400;white-space:nowrap}
.clock{position:sticky;top:calc(var(--topbar-h,100px) + 6px);z-index:4;text-align:center;margin:0 auto 12px;
  background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 18px;width:fit-content;
  font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.clock.over{color:var(--warn)}
.block-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.block-head b{font-size:18px}
.block-head .rounds{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent)}
.block.done-blk{opacity:.55}
.exrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.exrow .dot{color:var(--dim);font-size:13px;width:16px;text-align:center}
.exrow .dot.has{color:var(--accent)}
.exrow .nm{font-weight:600}
.exrow .sum{margin-left:auto;font-size:13px;color:var(--dim);text-align:right;max-width:45%}
.exfocus{border-top:1px solid var(--line);padding:11px 0 4px;border-left:3px solid var(--accent);
  padding-left:10px;margin-left:-13px;padding-right:0;background:linear-gradient(90deg,rgba(74,222,128,.06),transparent)}
.exfocus .nm{font-weight:800;font-size:18px}
.setchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.setchip{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;
  padding:6px 12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.setchip span{color:var(--dim);font-weight:400;margin-left:4px}
.inrow{display:flex;gap:8px;margin-top:10px}
.inrow .group{flex:1;display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.inrow input{flex:1;width:40px;min-width:0;border:none;background:transparent;color:var(--text);
  font-size:19px;font-weight:700;text-align:center;padding:12px 2px;outline:none}
.inrow .step{border:none;background:transparent;color:var(--accent);font-size:22px;font-weight:700;width:44px;cursor:pointer}
.lbl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;text-align:center;margin-bottom:3px}
.addex{background:none;border:none;color:var(--accent);font-size:15px;font-weight:700;padding:10px 4px 2px;cursor:pointer}
.banner{background:var(--accent-dark);color:#fff;border-radius:14px;padding:13px 16px;font-weight:700;
  text-align:center;margin-bottom:12px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;
  background:rgba(20,23,29,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1;background:none;border:none;color:var(--dim);font-size:11px;
  font-weight:600;padding:8px 0 10px;cursor:pointer}
.bottomnav button .ico{display:block;font-size:22px;margin-bottom:1px}
.bottomnav button.on{color:var(--accent)}
.timer-bar{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:9;
  background:var(--accent-dark);color:#fff;border-radius:14px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.timer-bar.flash{animation:flash .5s 4}
@keyframes flash{50%{background:var(--warn)}}
.timer-bar .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer-bar button{border:none;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;
  font-size:15px;font-weight:700;padding:8px 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--text);
  border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow-y:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.modal h3{margin:0 0 10px;font-size:19px}
.pick{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
  color:var(--text);font-size:17px;padding:13px 4px;cursor:pointer}
.search{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2);
  color:var(--text);font-size:17px;padding:12px;outline:none;margin-bottom:8px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2);
  color:var(--text);font-size:16px;padding:10px;outline:none;font-family:inherit}
select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card2);
  color:var(--text);font-size:17px;font-weight:600;padding:12px;outline:none;-webkit-appearance:none;appearance:none}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line);color:var(--text);padding:11px 18px;
  border-radius:999px;font-size:15px;font-weight:600;z-index:30;box-shadow:0 4px 18px rgba(0,0,0,.5);
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.seg button{flex:1;border:none;background:var(--card2);color:var(--dim);font-size:15px;font-weight:700;padding:11px 0}
.seg button.on{background:var(--accent-dark);color:#fff}
.stat{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:16px}
.stat:last-child{border-bottom:none}
.stat b{font-variant-numeric:tabular-nums}
.sess-head{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--card2);color:var(--dim)}
.badge.ok{color:var(--accent)}
.center{text-align:center;color:var(--dim);padding:30px 10px}
.wk{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--dim)}
a{color:var(--accent)}
</style>
</head>
<body>
<header class="topbar"><h1 id="title">Workout</h1><div class="sub" id="subtitle"></div></header>
<main id="main"></main>
<div id="timerWrap"></div>
<nav class="bottomnav">
  <button data-action="nav" data-v="workout" class="on"><span class="ico">🏋️</span>Workout</button>
  <button data-action="nav" data-v="history"><span class="ico">📅</span>History</button>
  <button data-action="nav" data-v="progress"><span class="ico">📈</span>Progress</button>
  <button data-action="nav" data-v="exercises"><span class="ico">📋</span>Exercises</button>
  <button data-action="nav" data-v="more"><span class="ico">⚙️</span>More</button>
</nav>
<div id="modalWrap"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* ============ storage & migration ============ */
const DATA_KEY='wt_data_v1', ACTIVE_KEY='wt_active_v1', TIMER_KEY='wt_timer_v1';
function load(k,fb){try{const v=JSON.parse(localStorage.getItem(k));return v==null?fb:v}catch(e){return fb}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}
  catch(e){try{toast('⚠️ Couldn’t save — storage full? Export a backup')}catch(_){}return false}}
const DEFAULTS={unit:'lb',roundRest:60,sessionTarget:25};
let D=load(DATA_KEY,null);
if(!D)D={version:2,sessions:[],customExercises:[],settings:Object.assign({},DEFAULTS)};
if(D.version===1){D.version=2;if(D.settings&&D.settings.autoTimer>0)D.settings.roundRest=D.settings.autoTimer}
D.settings=Object.assign({},DEFAULTS,D.settings||{});
delete D.settings.relayUrl;                       // Notion relay retired in favour of cloud sync
// Change-times for the only two records that can conflict across devices.
if(typeof D.settingsAt!=='string')D.settingsAt='';
if(typeof D.programAt!=='string')D.programAt='';
if(!D.routineDates||typeof D.routineDates!=='object')D.routineDates={};
if(Array.isArray(D.stretchDates)){D.routineDates.morning=D.stretchDates;delete D.stretchDates}
['morning','active'].forEach(k=>{if(!Array.isArray(D.routineDates[k]))D.routineDates[k]=[]});
save(DATA_KEY,D);
let A=load(ACTIVE_KEY,null);            // active (in-progress) session
if(A&&!A.blocks){                       // migrate any v1 in-flight session
  A.blocks=[{rounds:3,round:1,done:false,exercises:A.exercises||[]}];
  delete A.exercises;A.cur={b:0,e:0};
}
let T=load(TIMER_KEY,null);             // timer {endsAt,total,done} (+mode:'work',b,e for work intervals)
if(T&&T.endsAt<=Date.now()){
  // a work interval that finished while the app was closed still counts — log it
  if(T.mode==='work'&&A&&A.blocks&&A.blocks[T.b]&&A.blocks[T.b].exercises[T.e]){
    const ex=A.blocks[T.b].exercises[T.e];
    ex.sets.push({w:parseFloat(ex._w)||0,secs:T.total});
    persistA();
  }
  T=null;localStorage.removeItem(TIMER_KEY);
}
let view='workout', expanded={}, progressEx='', progressMetric='top';
let ST=null;          // active stretch routine {r,i,endsAt,paused,remaining}
let previewIdx=null;  // day being previewed before starting
let previewDraft=null;// editable copy of that day's blocks (session-only swaps live here)
let previewVar=0;     // which variant the preview is showing
let swapCtx=null;     // {b,e,name} mid-swap
let exFilter='';      // exercises tab search
function persist(){return save(DATA_KEY,D)}
function touchSettings(){D.settingsAt=new Date().toISOString()}
function touchProgram(){D.programAt=new Date().toISOString()}
function persistA(){if(A)return save(ACTIVE_KEY,A);localStorage.removeItem(ACTIVE_KEY);return true}

/* ============ Matt's program (Mon-Fri, 25-min superset blocks) ============
   Each day has variants (A = his original; B/C rotate weekly so the body never settles). */

  {label:'A',blocks:[
   {rounds:3,exercises:[
    {n:'Barbell Back Squat',secs:60,w:135,cue:'Cage bar. Ribs down, brace before you unrack.'},
    {n:'Dead Bug',secs:45,w:0,cue:'4 slow reps. Low back flat - stop the moment it lifts.'},

 ]},
 {day:'Tue',name:'Upper Body A',variants:[
  {label:'A',blocks:[

   {rounds:3,exercises:[

   {rounds:3,exercises:[

  {label:'B',blocks:[

  {label:'C',blocks:[

/* Effective program: Matt's persistent edits (D.program) win over the built-in default */
function PROG(){return (Array.isArray(D.program)&&D.program.length===PROGRAM.length&&D.program.every(d=>d&&Array.isArray(d.variants)&&d.variants.length))?D.program:PROGRAM}
function editableProgram(){
  if(!Array.isArray(D.program)||D.program.length!==PROGRAM.length||!D.program.every(d=>d&&Array.isArray(d.variants)&&d.variants.length))
    D.program=JSON.parse(JSON.stringify(PROGRAM));
  return D.program;
}
function migrateProgram(){
  if(!Array.isArray(D.program)||D.program.length!==PROGRAM.length){if(D.program!==undefined)delete D.program;return}
  D.program=D.program.map((d,i)=>{
    if(d&&Array.isArray(d.variants)&&d.variants.length)return d;
    const def=JSON.parse(JSON.stringify(PROGRAM[i].variants));
    if(d&&Array.isArray(d.blocks))def[0]={label:'A',blocks:d.blocks};
    return {day:PROGRAM[i].day,name:(d&&d.name)||PROGRAM[i].name,variants:def};
  });
}
/* which variant this week suggests: rotates every Monday */
function weekVariant(p){const wk=Math.floor(Date.parse(mondayStr())/604800000);return ((wk%p.variants.length)+p.variants.length)%p.variants.length}

function fmtClock(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}

/* Progression by stall detection. The program is time-based, so a finished 45s
   interval carries no performance signal — it looks identical every session.
   The one thing history CAN tell us is "you have used this same weight N
   sessions running", which is the cue to try more. Suggestion only: nothing
   changes the load until Matt taps it. PowerBlocks move in 10s with the handle
   inserts left alone, and a pair of 5s is the safe barbell jump, so +10 is the
   step everywhere. */
const STALL_SESSIONS=3, STALL_STEP=10;
function stallSuggest(name){
  const n=name.toLowerCase(),tops=[];
  sortedSessions().forEach(s=>{                 // newest first
    let top=0;
    sessExercises(s).forEach(e=>{
      if(e.name.toLowerCase()!==n)return;
      e.sets.forEach(x=>{if((x.w||0)>top)top=x.w});
    });
    if(top>0)tops.push(top);                    // one entry per session
  });
  if(tops.length<STALL_SESSIONS)return null;
  for(let i=1;i<STALL_SESSIONS;i++)if(tops[i]!==tops[0])return null;
  return {from:tops[0],to:tops[0]+STALL_STEP,n:STALL_SESSIONS};
}
function lastSets(name){const n=name.toLowerCase();
  for(const s of sortedSessions()){const e=sessExercises(s).find(x=>x.name.toLowerCase()===n);if(e&&e.sets.length)return e.sets}
  return null}
function lastSetsTpl(name,tpl){const n=name.toLowerCase();
  for(const s of sortedSessions()){if(s.template!==tpl)continue;
    const e=sessExercises(s).find(x=>x.name.toLowerCase()===n);if(e&&e.sets.length)return e.sets}
  return null}
function maxWeight(name){const n=name.toLowerCase();let m=0;
  D.sessions.forEach(s=>sessExercises(s).forEach(e=>{if(e.name.toLowerCase()===n)e.sets.forEach(x=>{if(x.w>m)m=x.w})}));return m}

function mondayStr(){const d=new Date();const off=(d.getDay()+6)%7;const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-off);
  return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0')}

function mkEx(entry,tpl){
  const name=typeof entry==='string'?entry:entry.n;
  const secs=(typeof entry==='object'&&entry.secs)?entry.secs:null;
  const defW=(typeof entry==='object'&&entry.w!=null)?entry.w:null;
  // prefill priority: last time on THIS day's workout > program default > last time anywhere
  const tplLast=tpl?lastSetsTpl(name,tpl):null;
  const anyLast=lastSets(name);
  const ls=tplLast?tplLast[tplLast.length-1]:null;
  const fb=anyLast?anyLast[anyLast.length-1]:null;
  let w='';
  if(ls)w=String(ls.w);
  else if(defW!=null)w=String(defW);
  else if(fb)w=String(fb.w);
  const rSrc=ls||fb;
  const cue=(typeof entry==='object'&&typeof entry.cue==='string')?entry.cue:'';
  return {name,secs,cue,sets:[],_w:w,_r:(rSrc&&rSrc.r!=null)?String(rSrc.r):''};
}
function startSession(i,draftBlocks,variantLabel){
  const p=i==='empty'?null:PROG()[i];

  A={id:uid(),date:todayStr(),startedAt:new Date().toISOString(),template:p?p.name:'Custom',
     variant:p?(variantLabel||p.variants[weekVariant(p)].label):undefined,
     blocks:p?src.map(b=>({rounds:b.rounds,round:1,done:false,exercises:b.exercises.map(e=>mkEx(e,p.name))}))
             :[{rounds:3,round:1,done:false,exercises:[]}],
     cur:{b:0,e:0},notes:'',synced:false};
  persistA();acquireWake();render();
}

function finishWorkEarly(){
  if(!T||T.mode!=='work')return;
  const elapsed=Math.max(1,Math.round(T.total-Math.max(0,(T.endsAt-Date.now())/1000)));
  const wb=T.b,we=T.e;
  T=null;localStorage.removeItem(TIMER_KEY);
  workComplete(wb,we,elapsed);
}
function startWorkFor(bi,ei){
  if(!A||!A.blocks[bi]||!A.blocks[bi].exercises[ei])return;
  const ex=A.blocks[bi].exercises[ei];
  if(!ex.secs){render();return}   // rep-based: focus and wait for a manual log
  A.cur={b:bi,e:ei};persistA();
  T={endsAt:Date.now()+ex.secs*1000,total:ex.secs,done:false,mode:'work',b:bi,e:ei};
  save(TIMER_KEY,T);
  renderActive.scrollNext=true;render();
}
function workComplete(bi,ei,secs){
  if(!A||!A.blocks[bi]||!A.blocks[bi].exercises[ei]){renderTimer();return}
  const ex=A.blocks[bi].exercises[ei];
  const w=parseFloat(ex._w)||0;
  const n=ex.name.toLowerCase();
  const sessMax=Math.max(0,...A.blocks.flatMap(b=>b.exercises).filter(x=>x.name.toLowerCase()===n).flatMap(x=>x.sets.map(s=>s.w||0)));
  const prevMax=Math.max(maxWeight(ex.name),sessMax);
  ex.sets.push({w,secs});
  if(w>0&&w>prevMax)toast('🎉 New PR on '+ex.name+'!');
  else toast('Interval done — '+(w>0?w+' '+unit():'BW')+' × '+fmtClock(secs));
  advance(bi,ei);
  // auto-flow: if no rest started and the next exercise is timed, run a 5s get-ready countdown
  if(!T&&A.cur){
    const nx=A.blocks[A.cur.b]&&A.blocks[A.cur.b].exercises[A.cur.e];
    if(nx&&nx.secs&&!A.blocks[A.cur.b].done){
      T={mode:'next',endsAt:Date.now()+5000,total:5,done:false,b:A.cur.b,e:A.cur.e};
      save(TIMER_KEY,T);
    }
  }
  renderActive.scrollNext=true;
  persistA();render();
}
function logSet(bi,ei){
  const blk=A.blocks[bi],ex=blk.exercises[ei];
  const w=parseFloat(ex._w)||0,r=parseInt(ex._r,10)||0;
  if(r<=0){toast('Enter reps first');return}
  const n=ex.name.toLowerCase();
  const sessMax=Math.max(0,...A.blocks.flatMap(b=>b.exercises).filter(x=>x.name.toLowerCase()===n).flatMap(x=>x.sets.map(s=>s.w||0)));
  const prevMax=Math.max(maxWeight(ex.name),sessMax);
  ex.sets.push({w,r});
  if(w>0&&w>prevMax)toast('🎉 New PR on '+ex.name+'!');
  advance(bi,ei);
  renderActive.scrollNext=true;
  persistA();render();
}
function advance(bi,ei){
  const blk=A.blocks[bi];
  const ne=ei+1;
  if(ne<blk.exercises.length){A.cur={b:bi,e:ne};return}
  // end of a round
  if(blk.round<blk.rounds){
    blk.round++;A.cur={b:bi,e:0};
    startTimer(D.settings.roundRest);
    if(T&&!T.mode){T.next={b:bi,e:0};save(TIMER_KEY,T)}  // auto-start round when rest ends
    toast('Round done — rest '+D.settings.roundRest+'s');
    return;
  }
  // block complete
  blk.done=true;
  const nxt=A.blocks.findIndex(b=>!b.done&&b.exercises.length>0);
  if(nxt>=0){
    A.cur={b:nxt,e:0};
    startTimer(D.settings.roundRest);
    toast('Interval '+(bi+1)+' complete! 💪');
  }else{
    A.cur=null;
    stopTimer();
  }
}
function finishSession(){
  const keptBlocks=A.blocks.map(b=>({rounds:b.rounds,exercises:b.exercises.filter(e=>e.sets.length>0).map(e=>({name:e.name,sets:e.sets}))}))
    .filter(b=>b.exercises.length>0);
  if(!keptBlocks.length){showConfirm('No sets logged','Nothing was logged. Discard this workout?',()=>{A=null;persistA();closeModal();render()});return}
  const sess={id:A.id,date:A.date,startedAt:A.startedAt,finishedAt:new Date().toISOString(),
    template:A.template,variant:A.variant,blocks:keptBlocks,notes:(A.notes||'').trim(),synced:false};
  if(!D.sessions.some(s=>s.id===sess.id))D.sessions.push(sess);
  if(!persist()){D.sessions=D.sessions.filter(s=>s!==sess);return}
  A=null;persistA();stopTimer();releaseWake();
  toast('Workout saved 💪');render();
  if(signedIn())syncNow(true);          // silent; a failure never blocks the save
}

    else y=e.sets.reduce((a,x)=>a+(x.w||0)*(x.r!=null?x.r:(x.secs||0)/60),0);
    pts.push({d:s.date,y:Math.round(y*10)/10});

  </div>

  <div class="card">
    <div class="stat"><span>Best (${progressMetric==='vol'?'volume':progressMetric==='1rm'?'est. 1RM':'top set'})</span><b>${best.toLocaleString()} ${unit()}</b></div>
    <div class="stat"><span>Most recent</span><b>${lastP.y.toLocaleString()} ${unit()} · ${fmtDate(lastP.d)}</b></div>

  </div>`;

function chart(pts){
  const W=340,H=190,P={l:14,r:14,t:18,b:26};
  if(pts.length===1){
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <circle cx="${W/2}" cy="${H/2}" r="5" fill="var(--accent)"/>
      <text x="${W/2}" y="${H/2-14}" fill="var(--text)" font-size="14" font-weight="700" text-anchor="middle">${pts[0].y.toLocaleString()}</text>
      <text x="${W/2}" y="${H-6}" fill="var(--dim)" font-size="11" text-anchor="middle">${fmtDate(pts[0].d)}</text></svg>`;
  }
  const ys=pts.map(p=>p.y);
  let lo=Math.min(...ys),hi=Math.max(...ys);
  if(lo===hi){lo-=1;hi+=1}
  const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;if(lo<0)lo=0;
  const x=i=>P.l+i*(W-P.l-P.r)/(pts.length-1);
  const y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
  let grid='';
  for(let g=0;g<4;g++){const gy=P.t+g*(H-P.t-P.b)/3;
    grid+=`<line x1="${P.l}" x2="${W-P.r}" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>`}
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join('');
  const iMax=ys.indexOf(Math.max(...ys));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${grid}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${x(iMax).toFixed(1)}" y="${(y(ys[iMax])-9).toFixed(1)}" fill="var(--text)" font-size="12" font-weight="700" text-anchor="middle">${ys[iMax].toLocaleString()}</text>
    <text x="${P.l}" y="${H-6}" fill="var(--dim)" font-size="11">${fmtDate(pts[0].d)}</text>
    <text x="${W-P.r}" y="${H-6}" fill="var(--dim)" font-size="11" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>
  </svg>`;
}

/* ---- exercises ---- */
function exerciseUniverse(){
  const set=new Set(CATALOG);
  D.customExercises.forEach(n=>set.add(n));
  PROG().forEach(p=>p.variants.forEach(v=>v.blocks.forEach(b=>b.exercises.forEach(e=>set.add(typeof e==='string'?e:e.n)))));
  D.sessions.forEach(s=>sessExercises(s).forEach(e=>set.add(e.name)));
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function programUsage(name){
  const n=name.toLowerCase(),out=[];
  PROG().forEach(p=>p.variants.forEach(v=>v.blocks.forEach((b,bi)=>b.exercises.forEach(e=>{
    const en=typeof e==='string'?e:e.n;
    if(en.toLowerCase()===n)out.push({day:p.day,tpl:p.name,variant:v.label,interval:bi+1,
      secs:(typeof e==='object'&&e.secs)?e.secs:null,
      w:(typeof e==='object'&&e.w!=null)?e.w:null});
  }))));
  return out;
}
function exListHTML(filter){
  const f=(filter||'').toLowerCase();

let audioCtx=null;
function audioSessionPlayback(){try{if('audioSession' in navigator)navigator.audioSession.type='playback'}catch(e){}}

  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state!=='running')audioCtx.resume()}catch(e){}}
let wakeLock=null;
async function acquireWake(){try{if('wakeLock' in navigator&&(A||ST))wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}

function startTimer(secs){
  if(!secs||secs<=0)return;
  unlockAudio();
  T={endsAt:Date.now()+secs*1000,total:secs,done:false};
  save(TIMER_KEY,T);renderTimer();
}
function stopTimer(){T=null;localStorage.removeItem(TIMER_KEY);renderTimer()}
function beepN(n){
  try{
    audioSessionPlayback();
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const go=()=>{const t=audioCtx.currentTime;
      for(let i=0;i<n;i++){const off=i*.35;
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;
        g.gain.setValueAtTime(.001,t+off);
        g.gain.exponentialRampToValueAtTime(.5,t+off+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+off+.3);
        o.start(t+off);o.stop(t+off+.32);
      }};
    if(audioCtx.state!=='running')audioCtx.resume().then(go).catch(()=>{});else go();
  }catch(e){}
}

  const w=$('#timerWrap');

    ${(work||nxt)?`<span style="font-size:13px;font-weight:700;opacity:.9;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nxt?'Next: ':''}${esc(label)}</span>`:''}

/* ============ sync / backup ============ */
/* Cloud sync (Supabase). The Postgres table `sync_records` is SHARED with
   StrikeZone, so the isolation here is deliberate rather than incidental:
     - our own auth storage key. Both apps sit on the same origin and
       localStorage is per-origin, so the supabase-js default key would have
       meant ONE shared session — signing out here would sign out StrikeZone.
     - every table_name carries a wt_ prefix, so a collision is impossible.
     - pull filters table_name server-side, so fishing rows never reach us.
   Hand-rolled REST rather than the JS client: there's no build step to vendor a
   library into, and owning the token storage outright is the whole point.
   Entirely optional — signed out or offline the app behaves exactly as before.
   Tokens live under their own key, never inside D, so they stay out of backups. */
const SUPA_URL='https://tocczuoekymnvlevxdke.supabase.co';
const SUPA_ANON='sb_publishable_TmZptCMDbuGpccsABC3lhQ_QV9UJJV4';
const AUTH_KEY='wt_auth_v1', SYNC_KEY='wt_sync_v1';
const T_SESS='wt_sessions', T_ROUT='wt_routineDates', T_CUST='wt_customExercises',
      T_SET='wt_settings', T_PROG='wt_program';
const SYNC_TABLES=[T_SESS,T_ROUT,T_CUST,T_SET,T_PROG];
const EPOCH='1970-01-01T00:00:00Z';
let AU=load(AUTH_KEY,null);
let SY=load(SYNC_KEY,null);
if(!SY||typeof SY!=='object')SY={cursor:EPOCH,ledger:{},device:uid(),lastSync:''};
if(!SY.device)SY.device=uid();
if(!SY.ledger||typeof SY.ledger!=='object')SY.ledger={};
if(!SY.cursor)SY.cursor=EPOCH;
let syncing=false;
function persistSY(){save(SYNC_KEY,SY)}
function signedIn(){return !!(AU&&AU.refresh&&AU.uid)}
function setAuth(a){AU=a;if(a)save(AUTH_KEY,a);else localStorage.removeItem(AUTH_KEY)}
function signOutLocal(){setAuth(null);SY.cursor=EPOCH;SY.ledger={};SY.lastSync='';persistSY()}

async function authPost(grant,body){
  const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',
    headers:{'apikey':SUPA_ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.error||('HTTP '+r.status));
  return j;
}
function storeToken(j,fb){
  setAuth({access:j.access_token,refresh:j.refresh_token||(fb&&fb.refresh),
    exp:Date.now()+((j.expires_in||3600)*1000),
    uid:(j.user&&j.user.id)||(fb&&fb.uid),
    email:(j.user&&j.user.email)||(fb&&fb.email)||''});
}
async function signIn(email,password){storeToken(await authPost('password',{email:email,password:password}),null)}
async function refreshAuth(){
  if(!AU||!AU.refresh)throw new Error('Not signed in');
  storeToken(await authPost('refresh_token',{refresh_token:AU.refresh}),AU);
}
/* One authenticated REST call, refreshing an expired token at most once. */
async function rest(path,opts,retried){
  if(!retried&&AU&&AU.exp&&AU.exp-Date.now()<60000)await refreshAuth();
  const o=Object.assign({},opts||{});
  o.headers=Object.assign({'apikey':SUPA_ANON,'Authorization':'Bearer '+(AU?AU.access:''),
    'Content-Type':'application/json'},(opts&&opts.headers)||{});
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,o);
  if((r.status===401||r.status===403)&&!retried){await refreshAuth();return rest(path,opts,true)}
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text().catch(()=>'')).slice(0,140));
  return r;
}

/* Every local record, per table. Sessions, routine days and custom names are
   keyed by id and unioned; settings and program are single rows, newest-wins. */
function localRows(){
  const m={};
  m[T_SESS]=D.sessions.map(x=>({id:x.id,data:x}));
  m[T_ROUT]=[];
  ['morning','active'].forEach(k=>(D.routineDates[k]||[]).forEach(d=>m[T_ROUT].push({id:k+'|'+d,data:{k:k,d:d}})));
  m[T_CUST]=D.customExercises.map(n=>({id:n,data:{n:n}}));
  m[T_SET]=[{id:'settings',data:{at:D.settingsAt||'',v:D.settings}}];
  m[T_PROG]=Array.isArray(D.program)?[{id:'program',data:{at:D.programAt||'',v:D.program}}]:[];
  return m;
}
function ledgerDrop(t,id){
  const L=SY.ledger[t];if(!Array.isArray(L))return;
  const i=L.indexOf(id);if(i>=0)L.splice(i,1);
}
/* Deletions propagate by diffing against the previous id ledger, so nothing has
   to hook the delete paths. */
async function pushLocal(){
  const lr=localRows(),rows=[],next={};
  SYNC_TABLES.forEach(t=>{
    const recs=lr[t]||[],ids=recs.map(r=>r.id),prev=Array.isArray(SY.ledger[t])?SY.ledger[t]:[];
    const singleton=(t===T_SET||t===T_PROG);
    next[t]=ids;
    recs.forEach(r=>{if(singleton||prev.indexOf(r.id)<0)
      rows.push({user_id:AU.uid,device_id:SY.device,table_name:t,record_id:r.id,data:r.data,deleted:false})});
    prev.forEach(id=>{if(ids.indexOf(id)<0)
      rows.push({user_id:AU.uid,device_id:SY.device,table_name:t,record_id:id,data:null,deleted:true})});
  });
  for(let i=0;i<rows.length;i+=200)
    await rest('sync_records?on_conflict=user_id,table_name,record_id',
      {method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},
       body:JSON.stringify(rows.slice(i,i+200))});
  SY.ledger=next;persistSY();
  return rows.length;
}
/* Merge one remote row. Returns true only if local data actually changed. */
function applyRemote(row){
  const t=row.table_name,id=row.record_id,d=row.data||{};
  if(t===T_SESS){
    if(row.deleted){const n=D.sessions.length;D.sessions=D.sessions.filter(x=>x.id!==id);ledgerDrop(t,id);return D.sessions.length!==n}
    if(D.sessions.some(x=>x.id===id))return false;    // a finished session never changes
    const ss=sanitizeSession(row.data);               // network data gets the same checks as a backup file
    if(!ss)return false;
    ss.synced=true;D.sessions.push(ss);return true;
  }
  if(t===T_ROUT){
    const k=d.k,day=d.d;
    if(k!=='morning'&&k!=='active')return false;
    if(typeof day!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(day))return false;
    const arr=D.routineDates[k];
    if(row.deleted){const i=arr.indexOf(day);ledgerDrop(t,id);if(i<0)return false;arr.splice(i,1);return true}
    if(arr.indexOf(day)>=0)return false;
    arr.push(day);arr.sort();return true;
  }
  if(t===T_CUST){
    if(row.deleted){const n=D.customExercises.length;D.customExercises=D.customExercises.filter(x=>x!==id);ledgerDrop(t,id);return D.customExercises.length!==n}
    if(typeof id!=='string'||!id||D.customExercises.indexOf(id)>=0)return false;
    D.customExercises.push(id);return true;
  }
  if(t===T_SET){
    if(row.deleted||!d.v||typeof d.v!=='object')return false;
    if((d.at||'')<=(D.settingsAt||''))return false;
    const v=d.v;
    if(v.unit==='lb'||v.unit==='kg')D.settings.unit=v.unit;
    if([0,45,60,75,90].indexOf(+v.roundRest)>=0)D.settings.roundRest=+v.roundRest;
    if([20,25,30,40].indexOf(+v.sessionTarget)>=0)D.settings.sessionTarget=+v.sessionTarget;
    D.settingsAt=d.at;return true;
  }
  if(t===T_PROG){
    if(row.deleted||!Array.isArray(d.v)||d.v.length!==PROGRAM.length)return false;
    if((d.at||'')<=(D.programAt||''))return false;
    if(!d.v.every(x=>x&&typeof x.name==='string'&&(Array.isArray(x.variants)||Array.isArray(x.blocks))))return false;
    D.program=d.v;migrateProgram();D.programAt=d.at;return true;
  }
  return false;
}
async function pullRemote(){
  const cursor=SY.cursor||EPOCH;
  let maxSeen=cursor,changed=0;
  const cols='table_name,record_id,data,updated_at,deleted';
  for(let off=0;;off+=500){
    const q='sync_records?select='+cols
      +'&table_name=in.('+SYNC_TABLES.join(',')+')'
      +'&updated_at=gt.'+encodeURIComponent(cursor)
      +'&or=(device_id.is.null,device_id.neq.'+encodeURIComponent(SY.device)+')'
      +'&order=updated_at.asc&limit=500&offset='+off;
    const batch=await (await rest(q,{method:'GET'})).json();
    if(!Array.isArray(batch))break;
    batch.forEach(row=>{
      if(row.updated_at>maxSeen)maxSeen=row.updated_at;
      if(SYNC_TABLES.indexOf(row.table_name)<0)return;  // belt and braces; the server already filtered
      if(applyRemote(row))changed++;
    });
    if(batch.length<500)break;
  }
  if(maxSeen>cursor){SY.cursor=maxSeen;persistSY()}
  return changed;
}
async function syncNow(silent){
  if(!signedIn()){if(!silent)showSignIn();return}
  if(syncing)return;
  if(!navigator.onLine){if(!silent)toast('Offline — sync when you have signal');return}
  syncing=true;

    const up=await pushLocal();
    const down=await pullRemote();
    D.sessions.forEach(x=>x.synced=true);

    if(!silent)toast('✓ Synced'+(up?' ↑'+up:'')+(down?' ↓'+down:''));
    render();

}
async function copyData(){
  try{await navigator.clipboard.writeText(JSON.stringify(D));toast('Copied — paste somewhere safe')}
  catch(e){toast('Copy failed — use Download instead')}
}
function cleanSets(arr){return Array.isArray(arr)?arr.filter(x=>x&&typeof x==='object').map(x=>x.secs?{w:+x.w||0,secs:+x.secs||0}:{w:+x.w||0,r:+x.r||0}):[]}
function sanitizeSession(s){
  if(!s||typeof s!=='object')return null;
  if(typeof s.id!=='string'||!s.id)return null;
  if(typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date))return null;
  const out={id:s.id.replace(/[^\w-]/g,''),date:s.date,
    startedAt:typeof s.startedAt==='string'?s.startedAt:s.date,
    template:typeof s.template==='string'?s.template:'Custom',
    notes:typeof s.notes==='string'?s.notes:'',synced:!!s.synced};
  if(typeof s.finishedAt==='string')out.finishedAt=s.finishedAt;
  if(typeof s.variant==='string')out.variant=s.variant;
  if(!out.id)return null;
  const exOk=e=>e&&typeof e.name==='string'&&e.name&&Array.isArray(e.sets);
  if(Array.isArray(s.blocks)){
    out.blocks=s.blocks.filter(b=>b&&Array.isArray(b.exercises))
      .map(b=>({rounds:+b.rounds||3,exercises:b.exercises.filter(exOk).map(e=>({name:e.name,sets:cleanSets(e.sets)}))}))
      .filter(b=>b.exercises.length);
    if(!out.blocks.length)return null;
  }else if(Array.isArray(s.exercises)){
    out.exercises=s.exercises.filter(exOk).map(e=>({name:e.name,sets:cleanSets(e.sets)}));
    if(!out.exercises.length)return null;
  }else return null;
  return out;
}
function importData(txt){
  let obj;try{obj=JSON.parse(txt)}catch(e){toast('That isn’t valid backup JSON');return}
  if(!obj||!Array.isArray(obj.sessions)){toast('No workouts found in that backup');return}
  const have=new Set(D.sessions.map(s=>s.id));let added=0,skipped=0;
  obj.sessions.forEach(raw=>{
    const s=sanitizeSession(raw);
    if(!s){skipped++;return}
    if(!have.has(s.id)){have.add(s.id);D.sessions.push(s);added++}
  });
  if(Array.isArray(obj.customExercises))
    obj.customExercises.forEach(n=>{if(typeof n==='string'&&n&&!D.customExercises.includes(n))D.customExercises.push(n)});
  if(Array.isArray(obj.program)&&obj.program.length===PROGRAM.length&&
     obj.program.every(d=>d&&typeof d.name==='string'&&(Array.isArray(d.variants)||Array.isArray(d.blocks))))
    {D.program=obj.program;migrateProgram()}
  // routineDates + settings ride along in the export; restore them too, or a
  // restore silently wipes the stretch history and every preference.
  if(obj.routineDates&&typeof obj.routineDates==='object')
    ['morning','active'].forEach(k=>{
      const inc=obj.routineDates[k];
      if(!Array.isArray(inc))return;
      inc.forEach(d=>{if(typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!D.routineDates[k].includes(d))D.routineDates[k].push(d)});
      D.routineDates[k].sort();
    });
  if(obj.settings&&typeof obj.settings==='object'){
    const inc=obj.settings,st=D.settings;
    if(inc.unit==='lb'||inc.unit==='kg')st.unit=inc.unit;
    if([0,45,60,75,90].includes(+inc.roundRest))st.roundRest=+inc.roundRest;
    if([20,25,30,40].includes(+inc.sessionTarget))st.sessionTarget=+inc.sessionTarget;
  }
  persist();closeModal();
  toast(added?'Restored '+added+' workout'+(added===1?'':'s')+(skipped?' ('+skipped+' invalid skipped)':''):'Nothing new to restore');render();
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  if(T)unlockAudio();
  const bi=el.dataset.b!==undefined?+el.dataset.b:null;
  const ei=el.dataset.e!==undefined?+el.dataset.e:null;
  if(a==='nav'){view=el.dataset.v;render()}
  else if(a==='start')startSession(el.dataset.i==='empty'?'empty':+el.dataset.i);
  else if(a==='preview'){previewIdx=+el.dataset.i;const pp=PROG()[previewIdx];previewVar=weekVariant(pp);
    previewDraft=JSON.parse(JSON.stringify(pp.variants[previewVar].blocks));render()}
  else if(a==='previewVar'){previewVar=+el.dataset.v;
    previewDraft=JSON.parse(JSON.stringify(PROG()[previewIdx].variants[previewVar].blocks));render()}
  else if(a==='previewBack'){previewIdx=null;previewDraft=null;render()}
  else if(a==='previewStart'){const i=previewIdx,d=previewDraft,vl=PROG()[i].variants[previewVar].label;
    previewIdx=null;previewDraft=null;startSession(i,d,vl)}
  else if(a==='swapOpen'){swapCtx={b:+el.dataset.b,e:+el.dataset.e};showSwapPicker('')}
  else if(a==='swapPick'){swapCtx.name=el.dataset.n;showSwapScope()}
  else if(a==='swapNew'){const n=el.dataset.n.trim();if(!n)return;
    if(!D.customExercises.some(x=>x.toLowerCase()===n.toLowerCase()))D.customExercises.push(n);persist();
    swapCtx.name=n;showSwapScope()}
  else if(a==='swapToday')applySwap(false);
  else if(a==='swapAlways')applySwap(true);
  else if(a==='resetProgram')showConfirm('Reset weekly program?','All every-week swaps go back to the original program. Your workout history is untouched.',()=>{delete D.program;touchProgram();persist();closeModal();render();toast('Program reset to defaults')});
  else if(a==='stretchStart'){unlockAudio();ST={r:+el.dataset.r||0,i:0,paused:false,remaining:0,endsAt:null};stretchSetup();acquireWake();view='workout';render()}
  else if(a==='stretchPause'){if(!ST.endsAt&&!ST.paused)return;
    if(ST.paused){ST.endsAt=Date.now()+ST.remaining;ST.paused=false}else{ST.remaining=Math.max(0,ST.endsAt-Date.now());ST.paused=true}render()}
  else if(a==='stretchSkip')stretchAdvance();
  else if(a==='stretchPrev'){ST.i=Math.max(0,ST.i-1);stretchSetup();render()}
  else if(a==='stretchEnd'){ST=null;if(!A)releaseWake();render()}
  else if(a==='focus'){const blk=A.blocks[bi];if(blk.done){blk.done=false}A.cur={b:bi,e:ei};renderActive.scrollNext=true;persistA();render()}
  else if(a==='addEx'){pickerBlock=bi;showPicker('')}
  else if(a==='addBlock'){A.blocks.push({rounds:3,round:1,done:false,exercises:[]});persistA();render()}
  else if(a==='pick')addPicked(el.dataset.n);
  else if(a==='pickNew'){const n=el.dataset.n.trim();if(n){if(!D.customExercises.includes(n))D.customExercises.push(n);persist();addPicked(n)}else closeModal()}
  else if(a==='rmEx'){const blk=A.blocks[bi];const ex=blk.exercises[ei];
    const doRm=()=>{blk.exercises.splice(ei,1);
      if(A.cur&&A.cur.b===bi){
        if(!blk.exercises.length){const nxt=A.blocks.findIndex(b=>!b.done&&b.exercises.length>0);A.cur=nxt>=0?{b:nxt,e:0}:null}
        else if(A.cur.e>=blk.exercises.length)A.cur.e=0;
      }
      persistA();closeModal();render()};
    if(ex.sets.length)showConfirm('Remove '+ex.name+'?',ex.sets.length+' logged set(s) will be lost.',doRm);
    else doRm()}
  else if(a==='logSet')logSet(bi,ei);
  else if(a==='startWork'){
    if(T&&T.mode==='work'){
      if(T.b===bi&&T.e===ei){finishWorkEarly();return}
      toast('Interval already running');return}
    unlockAudio();
    const ex=A.blocks[bi].exercises[ei];
    A.cur={b:bi,e:ei};persistA();
    T={endsAt:Date.now()+ex.secs*1000,total:ex.secs,done:false,mode:'work',b:bi,e:ei};
    save(TIMER_KEY,T);render()}
  else if(a==='delSet'){const ex=A.blocks[bi].exercises[ei];const j=+el.dataset.j;const s=ex.sets[j];
    showConfirm('Delete set?',setW(s)+' × '+(s.secs?fmtClock(s.secs):s.r)+' will be removed.',()=>{ex.sets.splice(j,1);persistA();closeModal();render()})}
  else if(a==='step'){const ex=A.blocks[bi].exercises[ei],f=el.dataset.f,d=+el.dataset.d;
    if(f==='s'){ex.secs=Math.max(15,(ex.secs||60)+d*15);persistA();render();return}
    let val;
    if(f==='w'){const stepBy=unit()==='kg'?2.5:5;let v=(parseFloat(ex._w)||0)+d*stepBy;if(v<0)v=0;ex._w=val=String(Math.round(v*100)/100)}
    else{let v=(parseInt(ex._r,10)||0)+d;if(v<0)v=0;ex._r=val=String(v)}
    const inp=document.querySelector(`input[data-input="${f}"][data-b="${bi}"][data-e="${ei}"]`);
    if(inp)inp.value=val;
    persistA()}
  else if(a==='finish')finishSession();
  else if(a==='cancel')showConfirm('Discard workout?','This session will not be saved.',()=>{A=null;persistA();stopTimer();releaseWake();closeModal();render()});
  else if(a==='toggle'){const id=el.dataset.id;expanded[id]=!expanded[id];render()}
  else if(a==='delSess'){const id=el.dataset.id;
    showConfirm('Delete this workout?','It will be removed from this device.',()=>{D.sessions=D.sessions.filter(s=>s.id!==id);persist();closeModal();render()})}
  else if(a==='metric'){progressMetric=el.dataset.m;render()}
  else if(a==='timer')startTimer(+el.dataset.s);
  else if(a==='workDone')finishWorkEarly();
  else if(a==='exDetail')showExDetail(el.dataset.n);
  else if(a==='exAddOpen')showModal(`<h3>New exercise</h3>
    <input class="search" id="newExName" placeholder="e.g. DB Floor Press" autocomplete="off">
    <button class="btn btn-primary" data-action="exAdd">Add to library</button>`);
  else if(a==='exAdd'){const n=($('#newExName').value||'').trim();
    if(!n){toast('Type a name first');return}
    if(exerciseUniverse().some(x=>x.toLowerCase()===n.toLowerCase())){toast('Already in the library');return}
    D.customExercises.push(n);persist();closeModal();toast('Added '+n);render()}
  else if(a==='exDelete'){const n=el.dataset.n;D.customExercises=D.customExercises.filter(x=>x!==n);persist();closeModal();toast('Deleted '+n);render()}
  else if(a==='exProgress'){progressEx=el.dataset.n;view='progress';closeModal();render()}
  else if(a==='goNow'){if(T&&T.mode==='next'){const nb=T.b,ne=T.e;T=null;localStorage.removeItem(TIMER_KEY);beepN(1);startWorkFor(nb,ne)}}
  else if(a==='timerPlus'){if(T){T.endsAt+=30000;T.done=false;save(TIMER_KEY,T);renderTimer()}}
  else if(a==='timerStop'){const wasWork=T&&T.mode==='work';stopTimer();if(wasWork){toast('Interval cancelled');render()}}
  else if(a==='sync')syncNow(false);
  else if(a==='signInOpen')showSignIn();
  else if(a==='signInGo'){
    const em=($('#siEmail').value||'').trim(),pw=$('#siPass').value||'';
    if(!em||!pw){toast('Email and password both needed');return}
    toast('Signing in…');
    signIn(em,pw).then(()=>{closeModal();toast('Signed in');render();return syncNow(false)})
      .catch(err=>toast(String((err&&err.message)||err).slice(0,90)));
  }
  else if(a==='signOut')showConfirm('Sign out?','Your workouts stay on this device. Signing back in re-syncs everything.',
    ()=>{signOutLocal();closeModal();render();toast('Signed out')});
  else if(a==='bumpW'){
    const ex=A.blocks[+el.dataset.b].exercises[+el.dataset.e];
    ex._w=el.dataset.w;persistA();render();toast('Set to '+el.dataset.w+' '+unit());
  }
  else if(a==='export')exportData();
  else if(a==='copy')copyData();
  else if(a==='importOpen')showModal(`<h3>Restore from backup</h3>
    <p class="hint">Paste the contents of a backup file. Workouts merge in — nothing gets overwritten.</p>
    <textarea id="importTxt" rows="6" placeholder='{"version":2,"sessions":[…]}'></textarea>
    <button class="btn btn-primary" data-action="importDo">Restore</button>`);
  else if(a==='importDo')importData($('#importTxt').value);
  else if(a==='unit'){D.settings.unit=el.dataset.u;touchSettings();persist();render()}
  else if(a==='roundRest'){D.settings.roundRest=+el.dataset.s;touchSettings();persist();render()}
  else if(a==='target'){D.settings.sessionTarget=+el.dataset.m;touchSettings();persist();render()}
  else if(a==='clearAll'){
    const cloud=signedIn();
    showConfirm(cloud?'Reset this device?':'Erase ALL data?',
      cloud?'Clears the local copy only. Your workouts stay in the cloud and download again on the next sync.'
           :'Every workout on this device will be permanently deleted, and there is no cloud copy to restore from. Export a backup first!',
      ()=>{
    // SYNC_KEY goes too. Leaving the id ledger behind would make the next sync
    // read every cleared session as a deletion and tombstone it in the cloud —
    // this button says "on this device", so it must not propagate. Cleared and
    // still signed in, the next sync pulls the history back down instead.
    localStorage.removeItem(DATA_KEY);localStorage.removeItem(ACTIVE_KEY);
    localStorage.removeItem(TIMER_KEY);localStorage.removeItem(SYNC_KEY);location.reload()});
  }
  else if(a==='dismissInstallHint'){D.settings.installHintDismissed=true;persist();render()}
  else if(a==='confirmYes'){const cb=window._confirmCb;window._confirmCb=null;if(cb)cb()}
  else if(a==='closeModal'){if(!el.classList.contains('modal-bg')||e.target===el)closeModal()}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.change==='progressEx'){progressEx=e.target.value;render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.input==='w'||t.dataset.input==='r'){
    const ex=A.blocks[+t.dataset.b].exercises[+t.dataset.e];
    if(t.dataset.input==='w')ex._w=t.value;else ex._r=t.value;persistA()}
  else if(t.dataset.input==='notes'){A.notes=t.value;persistA()}
  else if(t.dataset.input==='pickerSearch'){const pl=$('#pickList');if(pl)pl.innerHTML=pickListHTML(t.value)}
  else if(t.dataset.input==='exSearch'){exFilter=t.value;const xl=$('#exList');if(xl)xl.innerHTML=exListHTML(exFilter)}
  else if(t.dataset.input==='swapSearch'){const sl=$('#swapList');if(sl)sl.innerHTML=swapListHTML(t.value)}
});

/* ============ boot ============ */
render();
if(A)acquireWake();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')
  navigator.serviceWorker.register('sw.js').catch(()=>{});
// Quiet catch-up on open. Deliberately after first paint, and silent on failure.
if(signedIn())setTimeout(()=>syncNow(true),1500);
</script>
