<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner 501 Mockup</title>
<meta name="theme-color" content="#0f1115">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#0f1115; --card:#1a1e26; --card2:#232834; --line:#2e3442;
  --text:#eef1f6; --dim:#8b93a3; --accent:#f43f5e; --accent-dark:#be123c;
  --good:#4ade80; --warn:#fbbf24; --danger:#f87171; --away:#38bdf8; --away-dark:#0369a1;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.wrap{max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}

/* top line */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .t{flex:1;min-width:0}
.top b{font-size:18px;font-weight:800}
.top .s{font-size:13px;color:var(--dim)}
.undo{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.undo:disabled{opacity:.35}
.seg2{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 a{padding:6px 12px;font-size:13px;font-weight:700;color:var(--dim);text-decoration:none}
.seg2 a.on{background:var(--card2);color:var(--text)}

/* the board of four */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px 12px 18px;overflow:hidden;min-width:0}
.pl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent-dark)}
.pl.away::before{background:var(--away-dark)}
.pl.on{border-color:var(--accent);background:#21161b}
.pl.done{opacity:.55}
.ph{display:flex;align-items:baseline;gap:8px;min-width:0}
.nm{font-weight:800;font-size:clamp(15px,2.2vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.on .nm::before{content:"▶ ";color:var(--accent)}
.lvl{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.badge{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.6px;border-radius:6px;padding:2px 7px;white-space:nowrap}
.badge.frz{background:#3b2a0c;color:var(--warn);border:1px solid #6b4e16}
.badge.aw{background:#3a2e08;color:#fde047;border:1px solid #a16207}
.badge.out{background:#123321;color:var(--good);border:1px solid #1f6b3f}
.sc{font-size:clamp(46px,min(11vw,12vh),150px);font-weight:900;line-height:1;letter-spacing:-2px;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.sc.bust{color:var(--danger)}
.slots{display:flex;gap:6px;align-items:center}
.slot{flex:1;min-width:0;height:clamp(34px,min(6vw,7.5vh),64px);border-radius:10px;background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(14px,min(2.6vw,3.4vh),28px);font-variant-numeric:tabular-nums}
button.slot{cursor:pointer}
.slot.e{color:var(--line)}
.slot.T{color:#1a1200;background:var(--warn);border-color:var(--warn)}
.slot.D{color:#04210f;background:var(--good);border-color:var(--good)}
.slot.B{color:#fff;background:var(--accent-dark);border-color:var(--accent)}
.slot.M{color:var(--dim)}
.tt{min-width:3.2em;text-align:right;font-weight:800;color:var(--dim);font-size:clamp(14px,2.4vw,19px);font-variant-numeric:tabular-nums}
.st{font-size:13px;color:var(--dim);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{color:var(--text)}

.ms{display:flex;gap:6px;margin-top:8px}
.ms div{flex:1;min-width:0;background:var(--card2);border-radius:10px;padding:5px 8px;text-align:center}
.ms span{display:block;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);text-transform:uppercase}
.ms b{display:block;font-size:clamp(18px,min(3vw,3.8vh),30px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.ms .lk b::after{content:" 🔒";font-size:.6em}
/* one-line status between board and controls */
.msg{margin:10px 0 0;border-radius:14px;padding:11px 14px;font-weight:700;font-size:16px;background:var(--card);border:1px solid var(--line)}
.msg.win{border-color:#1f6b3f;background:#10241a;color:var(--good)}
.msg.loss{border-color:#7f1d1d;background:#2a1215;color:#fecaca}
.msg .row{display:flex;gap:10px;align-items:center}
.msg .row span{flex:1}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--accent-dark);color:#fff}

/* fake board */
.fake{margin-top:10px;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:10px 12px 12px}
.fake .lbl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keys button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 0;font-weight:800;font-size:16px}
.keys button:active,.bb:active,.pad button:active{transform:scale(.97)}
.bb{display:block;width:100%;margin-top:8px;border:none;border-radius:12px;padding:15px;font-size:18px;font-weight:800;background:#1e3a5f;color:#dbeafe}

/* correction sheet */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 2px;font-size:18px}
.sheet .hint{font-size:13px;color:var(--dim);margin-bottom:10px}
.rings{display:flex;gap:6px;margin-bottom:8px}
.rings button{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 0;font-weight:800}
.rings button.on{background:var(--accent-dark);border-color:var(--accent);color:#fff}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pad button{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:12px 0;font-weight:800;font-size:17px}
.pad .wide{grid-column:span 5;padding:11px 0}
.sheet .alt{display:flex;gap:6px;margin-top:8px}
.sheet .alt button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:11px 0;font-weight:700;color:var(--dim)}

@media (max-width:520px){
  .ms{gap:4px} .ms div{padding:5px 2px} .ms span{letter-spacing:0}
  .wrap{padding-left:10px;padding-right:10px}
  .grid{gap:8px}
  .pl{padding:10px 10px 10px 14px;border-radius:14px}
  .pl::before{width:5px}
  .sc{letter-spacing:-1px}
  .lvl{display:none}
  .slots{gap:4px}
  .tt{min-width:2.4em}
  .st{font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="t"><b>Partner 501</b><div class="s" id="sub"></div></div>
    <div class="seg2"><a class="on" href="mock-501.html">501</a><a href="mock-cricket.html">Cricket</a></div>
    <button class="undo" id="mute" data-a="mute" aria-label="Sound on or off">🔊</button>
    <button class="undo" id="undo" data-a="undo">↶ Undo</button>
  </div>
  <div class="grid" id="grid"></div>
  <div id="msg"></div>
  <div class="fake">
    <div class="lbl">Fake board · mockup only — the real one is the GranBoard</div>
    <div class="keys">
      <button data-a="throw" data-v="T20">T20</button>
      <button data-a="throw" data-v="S20">20</button>
      <button data-a="throw" data-v="S1">1</button>
      <button data-a="throw" data-v="S5">5</button>
      <button data-a="throw" data-v="T19">T19</button>
      <button data-a="throw" data-v="S19">19</button>
      <button data-a="throw" data-v="D20">D20</button>
      <button data-a="throw" data-v="BULL">Bull</button>
      <button data-a="throw" data-v="MISS">Miss</button>
      <button data-a="other">Other…</button>
    </div>
    <button class="bb" data-a="board">⏎ Board button — end turn</button>
  </div>
</div>
<div id="modalwrap"></div>
<script>
'use strict';
/* Mockup of the partner 501 screen. Open out, every bull 50, NDA freeze:
   you may only go out if your partner's score is <= the opponents' combined.
   Turn order Matt, Opp 1, Partner, Opp 2. Ghost turns land instantly. */
const $ = s => document.querySelector(s);
const ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];   // clockwise from the top

function val(seg){
  if (seg === 'MISS') return 0;
  if (seg === 'BULL') return 50;
  const n = +seg.slice(1);
  return seg[0] === 'T' ? n * 3 : seg[0] === 'D' ? n * 2 : n;
}
function label(seg){ return seg === 'MISS' ? '—' : seg === 'BULL' ? 'BULL' : seg[0] === 'S' ? seg.slice(1) : seg; }
function cls(seg){ return seg === 'MISS' ? 'M' : seg === 'BULL' ? 'B' : seg[0] === 'S' ? '' : seg[0]; }

let G, snaps = [];
function newGame(){
  G = {
    game: G ? G.game % 7 + 1 : 1, round: 1, over: null, done: false,
    p: [
      {name:'Matt', team:0, lvl:'', score:501, start:501, turn:[], last:[], bust:false, darts:0, out:false},
      {name:'Dutch', team:1, lvl:'29 PPD', ppd:29, score:501, last:[], darts:0, out:false},
      {name:'Partner', team:0, lvl:'Me', ppd:24, score:501, last:[], darts:0, out:false},
      {name:'Rocco', team:1, lvl:'24 PPD', ppd:24, score:501, last:[], darts:0, out:false}
    ],
    lock80: null
  };
  snaps = [];
  render();
}
const me = () => G.p[0];
const partnerOf = i => G.p.find((q, j) => j !== i && q.team === G.p[i].team);
const oppsOf = i => G.p.filter(q => q.team !== G.p[i].team);
function frozen(i){
  const pa = partnerOf(i);
  return pa.score > oppsOf(i).reduce((s, q) => s + q.score, 0);
}


/* ---------- hit sounds: 1 for a single, 2 for a double, 3 for a treble ----------
   His darts only (ghost turns land all at once). iOS needs the context woken by a real
   oscillator on a tap, so the first click plays a silent blip. */
let AC = null, muted = false;
try { muted = localStorage.getItem('tm_mock_mute') === '1'; } catch (e) {}
let OUT = null, WARM = 0;
/* Sound chain copied from sounds.html so Soft coin sounds exactly as Matt picked it:
   compressor -16 dB / ratio 5 → master 1.2×, plus a 40 Hz keep-awake far too quiet
   to hear so the speakers never doze between darts and clip the next chirp. */
function audio(){
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    AC = new C();
    const comp = AC.createDynamicsCompressor(), vol = AC.createGain();
    comp.threshold.value = -16; comp.knee.value = 6; comp.ratio.value = 5;
    comp.attack.value = 0.002; comp.release.value = 0.12; vol.gain.value = 1.2;
    comp.connect(vol).connect(AC.destination); OUT = comp;
    const k = AC.createOscillator(), kg = AC.createGain();
    k.frequency.value = 40; kg.gain.value = 0.0004; k.connect(kg).connect(AC.destination); k.start();
    WARM = AC.currentTime + 0.35;   // the sound card takes a moment to open; nothing before this is heard
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(t, f, dur, peak, hold){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
  g.gain.setValueAtTime(peak, t + 0.005 + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(OUT); o.start(t); o.stop(t + dur + 0.02);
}
/* Soft coin (Matt's pick, sound board round 2 #2): a two-step coin on a triangle
   wave, each hit of a double/treble a step higher. 1 single, 2 double, 3 treble. */
function chirp(n){
  if (muted || !n) return;
  const ac = audio(); if (!ac) return;
  if (ac.state !== 'running'){ ac.resume().then(() => chirp(n)); return; }
  const t0 = Math.max(ac.currentTime + 0.03, WARM);
  for (let k = 0; k < n; k++){
    const t = t0 + k * 0.18, f = 988 * Math.pow(1.12, k);
    tone(t, f, 0.06, 0.6, 0.03);
    tone(t + 0.06, f * 1.335, 0.16, 0.6, 0.05);
  }
}
const chirps = seg => seg === 'MISS' ? 0 : seg[0] === 'T' ? 3 : seg[0] === 'D' ? 2 : 1;   // DB = 2, SB/BULL = 1

/* ---------- award jingles: same rounded triangle tone as Soft coin ----------
   Notes are MIDI numbers (88 = E6), each [start, note, length, level]. They play
   once the turn's result is known — after the last dart's coin — and never hold
   anything up. Bigger award wins: ton-80 > hat trick > high ton > low ton. */
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function jnote(t, m, dur, peak){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(midi(m), t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
  g.gain.setValueAtTime(peak, t + 0.004 + dur * 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(OUT); o.start(t); o.stop(t + dur + 0.02);
}
const JINGLES = {
  low:   [[0,88,.09],[.07,92,.09],[.14,95,.09],[.21,100,.26]],
  high:  [[0,83,.08],[.06,88,.08],[.12,92,.08],[.18,95,.08],[.24,100,.08],[.30,95,.07],[.36,100,.34],[.36,92,.34,.35]],
  ton80: [[0,83,.1],[.11,83,.1],[.22,83,.1],[.33,88,.36],[.33,92,.36,.4],[.72,92,.08],[.79,95,.08],
          [.86,100,.55],[.86,95,.55,.35],[.86,92,.55,.3]],
  hat:   [[0,100,.08],[.12,100,.08],[.24,100,.08],[.36,95,.07],[.42,92,.07],[.48,95,.07],[.54,104,.34],[.54,100,.34,.35]]
};
// cricket: 4 marks = a 3-note run; every extra mark adds a note and ends higher.
// 9 marks (Matt): the 8-mark run, with its top note struck three times to finish.
function marksJingle(n){
  const sc = [76,80,83,88,92,95,100], c = Math.max(3, Math.min(7, n - 1)), out = [];
  for (let i = 0; i < c - 1; i++) out.push([i * .065, sc[i], .08]);
  const t = (c - 1) * .065;
  if (n >= 9) out.push([t, sc[c - 1], .09], [t + .11, sc[c - 1], .09], [t + .22, sc[c - 1], .3]);
  else out.push([t, sc[c - 1], .3]);
  return out;
}
function jingle(spec, delay){
  if (typeof muted !== 'undefined' && muted) return;
  const ac = audio(); if (!ac) return;
  if (ac.state !== 'running'){ ac.resume().then(() => jingle(spec, delay)); return; }
  const t0 = Math.max(ac.currentTime + (delay || 0.03), typeof WARM !== 'undefined' ? WARM : 0);
  for (const [dt, m, dur, pk] of spec) jnote(t0 + dt, m, dur, pk || .5);
}
const after = c => c ? (c - 1) * 0.18 + 0.22 : 0.03;    // let the last dart's coin finish first
const AWARD = {low:'LOW TON', high:'HIGH TON', ton80:'TON 80', hat:'HAT TRICK'};
function award501(c){
  const m = me();
  if (m.awarded) return;
  m.awarded = true;
  if (m.bust) return;
  const tot = m.turn.reduce((s, x) => s + val(x), 0), bulls = m.turn.filter(x => x === 'BULL').length;
  const k = tot === 180 ? 'ton80' : bulls === 3 ? 'hat' : tot >= 151 ? 'high' : tot >= 100 ? 'low' : null;
  if (!k) return;
  m.badge = AWARD[k]; jingle(JINGLES[k], after(c));
}
function muteBtn(){ const b = $('#mute'); if (b) b.textContent = muted ? '🔇' : '🔊'; }

/* ---------- Matt's turn ---------- */
function evalTurn(){
  const m = me();
  let s = m.start; m.bust = false; m.out = false;
  for (const seg of m.turn){
    s -= val(seg);
    if (s < 0){ m.bust = true; break; }
    if (s === 0){ m.out = true; break; }
  }
  m.score = m.bust ? m.start : s;
}
function throwDart(seg){
  const m = me();
  if (G.done || m.turn.length >= 3 || m.bust || m.out) return;
  if (!m.turn.length){ m.badge = null; m.awarded = false; }     // a new turn clears last turn's award
  m.turn.push(seg);
  chirp(chirps(seg));
  evalTurn();
  if (m.out || (m.turn.length === 3 && !m.bust)) award501(chirps(seg));
  if (m.out) finishMe();
  render();
}
function finishMe(){
  const m = me();
  m.darts += m.turn.length; m.last = m.turn.slice(); m.turn = []; m.start = 0;
  if (G.over){ G.done = true; return; }          // finishing the leg after the game was decided
  if (frozen(0)) G.over = {team:1, why:'You went out frozen — Partner on ' + partnerOf(0).score +
      ', opponents combined ' + oppsOf(0).reduce((s, q) => s + q.score, 0) + '. Game to Dutch & Rocco.'};
  else G.over = {team:0, why:'Game shot — you went out. You & Partner win.'};
  G.done = true;
}
function boardButton(){
  const m = me();
  if (G.done) return;
  snaps.push(JSON.stringify(G)); if (snaps.length > 20) snaps.shift();
  if (m.turn.length && !m.bust) award501(0);     // fewer than 3 registered — the turn is final now
  // a turn is always 3 darts: anything that never registered counts as a 0
  while (m.turn.length < 3 && !m.bust) m.turn.push('MISS');
  m.darts += m.turn.length; m.last = m.turn.slice(); m.turn = []; m.start = m.score; m.bust = false; m.awarded = false;
  if (!G.lock80 && m.score <= 100) G.lock80 = {pts:501 - m.score, darts:m.darts};
  if (!G.over){
    for (const i of [1, 2, 3]){ ghostTurn(i); if (G.over) break; }
    G.round++;
  }
  render();
}

/* ---------- ghosts: a dart lands near where it was aimed ---------- */
const rnd = () => Math.random();
function neighbour(n){ const k = ORDER.indexOf(n); return ORDER[(k + (rnd() < .5 ? 19 : 1)) % 20]; }
function land(aim, ppd){
  const pT = Math.max(.08, Math.min(.6, (ppd - 16.6) / 40));
  if (aim === 'BULL') return rnd() < .3 + pT / 2 ? 'BULL' : 'S' + ORDER[Math.floor(rnd() * 20)];
  const r = aim[0], n = +aim.slice(1), x = rnd();
  if (r === 'T') return x < pT ? aim : x < .8 ? 'S' + n : 'S' + neighbour(n);
  if (r === 'D') return x < pT + .05 ? aim : x < .6 ? 'S' + n : x < .85 ? 'MISS' : 'S' + neighbour(n);
  return x < .78 ? aim : 'S' + neighbour(n);
}
function aimFor(rem){
  if (rem > 60) return 'T20';
  if (rem === 50) return 'BULL';
  if (rem <= 20) return 'S' + rem;
  if (rem % 3 === 0) return 'T' + rem / 3;
  if (rem % 2 === 0 && rem <= 40) return 'D' + rem / 2;
  return rem - 20 <= 20 ? 'S20' : 'T' + Math.min(20, Math.floor((rem - 2) / 3));
}
function ghostTurn(i){
  const g = G.p[i], start = g.score, turn = [];
  let s = start;
  for (let d = 0; d < 3; d++){
    let seg = land(aimFor(s), g.ppd);
    if (s - val(seg) === 0 && frozen(i)) seg = 'MISS';          // a frozen ghost holds rather than lose the game
    turn.push(seg);
    s -= val(seg);
    if (s < 0){ s = start; turn.push('BUST'); break; }
    if (s === 0) break;
  }
  g.last = turn.filter(x => x !== 'BUST'); g.bust = turn.includes('BUST');
  g.darts += g.last.length; g.score = s;
  if (s === 0){
    g.out = true;
    const mine = g.team === 0;
    G.over = {team:g.team, why:(mine ? 'Partner went out — you win the game.' : g.name + ' went out — Dutch & Rocco win.') +
      ' Finish your leg.'};
  }
}

/* ---------- correcting one of his darts ---------- */
let fix = null;   // {i, ring}
function openFix(i){
  fix = {i, ring: 'S'};
  const seg = me().turn[i];
  if (seg && /^[SDT]/.test(seg)) fix.ring = seg[0];
  renderFix();
}
function renderFix(){
  if (!fix){ $('#modalwrap').innerHTML = ''; return; }
  const seg = me().turn[fix.i];
  const nums = Array.from({length:20}, (_, k) => k + 1);
  $('#modalwrap').innerHTML = '<div class="modal" data-a="closefix"><div class="sheet">' +
    '<h3>Dart ' + (fix.i + 1) + ' — board said ' + label(seg) + '</h3>' +
    '<div class="hint">Tap what you actually hit. Your other darts stay as they are.</div>' +
    '<div class="rings">' + [['S','Single'],['D','Double'],['T','Treble']].map(r =>
      '<button class="' + (fix.ring === r[0] ? 'on' : '') + '" data-a="ring" data-v="' + r[0] + '">' + r[1] + '</button>').join('') + '</div>' +
    '<div class="pad">' + nums.map(n => '<button data-a="setseg" data-v="' + fix.ring + n + '">' + n + '</button>').join('') +
    '<button class="wide" data-a="setseg" data-v="BULL">Bull (50)</button></div>' +
    '<div class="alt"><button data-a="setseg" data-v="MISS">Bounce-out (0)</button>' +
    '<button data-a="rmdart">Remove dart</button></div></div></div>';
}

/* ---------- other… (fake board only) ---------- */
let other = null;
function renderOther(){
  if (!other){ return; }
  const nums = Array.from({length:20}, (_, k) => k + 1);
  $('#modalwrap').innerHTML = '<div class="modal" data-a="closefix"><div class="sheet">' +
    '<h3>Throw a dart</h3><div class="hint">Fake board — pretend the GranBoard registered this.</div>' +
    '<div class="rings">' + [['S','Single'],['D','Double'],['T','Treble']].map(r =>
      '<button class="' + (other.ring === r[0] ? 'on' : '') + '" data-a="oring" data-v="' + r[0] + '">' + r[1] + '</button>').join('') + '</div>' +
    '<div class="pad">' + nums.map(n => '<button data-a="othrow" data-v="' + other.ring + n + '">' + n + '</button>').join('') +
    '<button class="wide" data-a="othrow" data-v="BULL">Bull (50)</button></div></div></div>';
}

/* ---------- render ---------- */
function slotsHTML(segs, mine){
  let h = '';
  for (let k = 0; k < 3; k++){
    const seg = segs[k];
    if (!seg){ h += '<div class="slot e">·</div>'; continue; }
    h += mine ? '<button class="slot ' + cls(seg) + '" data-a="fix" data-v="' + k + '">' + label(seg) + '</button>'
              : '<div class="slot ' + cls(seg) + '">' + label(seg) + '</div>';
  }
  return h;
}
function render(){
  const m = me();
  $('#sub').textContent = 'League night · game ' + G.game + ' of 7 · round ' + G.round;
  $('#undo').disabled = !snaps.length;
  const order = [0, 2, 1, 3];    // home pair on top, away pair below
  $('#grid').innerHTML = order.map(i => {
    const p = G.p[i], mine = i === 0, live = mine && m.turn.length > 0;
    const segs = mine ? (m.turn.length ? m.turn : m.last) : p.last;
    const tot = segs.reduce((s, x) => s + val(x), 0);
    const on = mine && !G.done;
    const showBust = mine && m.bust;
    const frz = !G.over && !p.out && p.score <= 180 && p.score > 0 && frozen(i);
    let st = '';
    if (mine){
      const ppd = m.darts ? ((501 - (m.turn.length ? m.start : m.score)) / m.darts) : 0;
      // 80% runs live until it locks at 100 or less, then freezes
      const p80 = G.lock80 ? G.lock80.pts / G.lock80.darts : ppd;
      st = '<div class="ms"><div><span>PPD</span><b>' + (m.darts ? ppd.toFixed(1) : '–') + '</b></div>' +
        '<div' + (G.lock80 ? ' class="lk"' : '') + '><span>80%</span><b>' + (m.darts ? p80.toFixed(1) : '–') + '</b></div>' +
        '<div><span>Darts</span><b>' + m.darts + '</b></div></div>';
    } else st = '<div class="st">' + (p.darts ? 'PPD <b>' + ((501 - p.score) / p.darts).toFixed(1) + '</b>' : 'waiting') + '</div>';
    return '<div class="pl' + (p.team ? ' away' : '') + (on ? ' on' : '') + (p.out && !mine ? ' done' : '') + '">' +
      '<div class="ph"><span class="nm">' + p.name + '</span>' + (p.lvl ? '<span class="lvl">' + p.lvl + '</span>' : '') +
        (p.out ? '<span class="badge out">OUT</span>' : mine && m.badge ? '<span class="badge aw">' + m.badge + '</span>' : !mine && p.bust ? '<span class="badge frz">BUST</span>' : frz ? '<span class="badge frz">FROZEN</span>' : '') + '</div>' +
      '<div class="sc' + (showBust ? ' bust' : '') + '">' + (showBust ? 'BUST' : p.score) + '</div>' +
      '<div class="slots">' + slotsHTML(segs, mine && m.turn.length > 0 && !G.done) +
        '<span class="tt">' + (segs.length ? tot : '') + '</span></div>' + st + '</div>';
  }).join('');

  let msg = '';
  if (G.done){
    const won = G.over && G.over.team === 0;
    const ppd = (501 / m.darts).toFixed(1);
    msg = '<div class="msg ' + (won ? 'win' : 'loss') + '"><div class="row"><span>' +
      (G.over ? G.over.why.replace(' Finish your leg.', '') : '') + ' · your leg: ' + m.darts + ' darts, ' + ppd + ' PPD</span>' +
      '<button class="btn" data-a="next">Next game ›</button></div></div>';
  } else if (G.over){
    msg = '<div class="msg ' + (G.over.team === 0 ? 'win' : 'loss') + '">' + G.over.why + '</div>';
  } else if (m.bust){
    msg = '<div class="msg">Bust — pull your darts and hit the board button.</div>';
  } else if (m.turn.length === 3){
    msg = '<div class="msg">Pull your darts · board button for the next turn.</div>';
  } else if (frozen(0) && m.score <= 180){
    msg = '<div class="msg" style="border-color:#6b4e16;color:var(--warn)">Frozen — going out now loses the game. Partner ' +
      partnerOf(0).score + ' &gt; opponents ' + oppsOf(0).reduce((s, q) => s + q.score, 0) + '.</div>';
  }
  $('#msg').innerHTML = msg;
}

/* ---------- clicks ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  audio();                                                // (pointerdown below usually got here first)
  if (a === 'closefix' && e.target !== el) return;       // only the backdrop closes the sheet
  switch (a){
    case 'throw': throwDart(v); break;
    case 'board': boardButton(); break;
    case 'mute': muted = !muted; try { localStorage.setItem('tm_mock_mute', muted ? '1' : '0'); } catch (e) {} muteBtn(); break;
    case 'undo': if (snaps.length){ G = JSON.parse(snaps.pop()); render(); } break;
    case 'next': newGame(); break;
    case 'fix': if (me().turn[+v]) openFix(+v); break;
    case 'ring': fix.ring = v; renderFix(); break;
    case 'setseg': me().turn[fix.i] = v; fix = null; evalTurn(); if (me().out){ award501(0); finishMe(); } renderFix(); render(); break;
    case 'rmdart': me().turn.splice(fix.i, 1); fix = null; evalTurn(); renderFix(); render(); break;
    case 'closefix': fix = null; other = null; $('#modalwrap').innerHTML = ''; break;
    case 'other': other = {ring:'T'}; renderOther(); break;
    case 'oring': other.ring = v; renderOther(); break;
    case 'othrow': other = null; $('#modalwrap').innerHTML = ''; throwDart(v); break;
  }
});
newGame();
muteBtn();
// wake the audio as the finger lands, so it is running by the time the tap's chirp plays
document.addEventListener('pointerdown', () => audio(), {passive: true});
</script>
</body>
</html>
