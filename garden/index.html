<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GardenMap</title>
<meta name="theme-color" content="#3f6b35">
<style>
:root{
  --bg:#f4f1e8; --panel:#fffdf7; --line:#d8d0bd; --text:#2c2a22; --dim:#7a7460;
  --green:#3f6b35; --green-2:#5a8c46; --soil:#cdbb98;
  --accent:#e0671f; --danger:#c0392b;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
}
header{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; background:var(--green); color:#fff; flex:none;
}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px}
header .meta{font-size:12px;opacity:.92}
header .spacer{flex:1}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.toolbar button, .toolbar label{
  font:inherit;font-size:13px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
  color:#fff;border-radius:9px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.toolbar button:active{transform:scale(.96)}
.toolbar button.on{background:#fff;color:var(--green);border-color:#fff;font-weight:700}
.toolbar .sep{width:1px;height:22px;background:rgba(255,255,255,.3);margin:0 2px}
.toolbar input[type=range]{accent-color:#fff;width:84px}
main{display:flex;flex:1;min-height:0}
.stage-wrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
/* single plant-selector bar */
.selbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.selbar .lbl{font-size:12px;color:var(--dim);font-weight:800;text-transform:uppercase;letter-spacing:.5px;flex:none}
.plantsel{display:flex;align-items:center;gap:9px;flex:1;min-width:0;max-width:440px;font:inherit;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;text-align:left}
.plantsel:active{transform:scale(.99)}
.plantsel .em{font-size:20px;flex:none}
.plantsel .dot{width:13px;height:13px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.plantsel .nm{flex:1;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plantsel .sp{font-size:12.5px;color:var(--dim);font-weight:600;flex:none}
.plantsel .car{color:var(--dim);font-size:12px;flex:none}
/* dropdown */
.dropdown{position:absolute;z-index:30;top:53px;left:12px;width:min(440px,calc(100% - 24px));max-height:64vh;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 44px rgba(0,0,0,.26);
  display:flex;flex-direction:column;overflow:hidden}
.dropdown.hidden{display:none}
.dd-search{padding:10px;border-bottom:1px solid var(--line)}
.dd-search input{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
.dd-list{overflow:auto;flex:1;padding:4px}
.dd-cat{font-size:10.5px;font-weight:800;color:var(--green-2);text-transform:uppercase;letter-spacing:.7px;padding:9px 8px 3px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.prow:hover{background:#f0ece0}
.prow.sel{background:#eaf3e4;outline:2px solid var(--green);outline-offset:-2px}
.prow .em{font-size:19px;width:24px;text-align:center;flex:none}
.prow .dot{width:13px;height:13px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.prow .nm{flex:1;font-size:14.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sp{font-size:12px;color:var(--dim);flex:none}
.prow .act{border:none;background:none;cursor:pointer;font-size:15px;color:var(--dim);padding:3px 6px;border-radius:7px;flex:none}
.prow .act:hover{background:#e2dcce;color:var(--text)}
.dd-foot{padding:8px;border-top:1px solid var(--line)}
.dd-foot button{width:100%;font:inherit;font-size:14px;font-weight:700;border:1px dashed var(--green-2);background:#eef5e9;color:var(--green);border-radius:10px;padding:11px;cursor:pointer}
/* color picker (in add/edit modal) */
.cpick{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;align-items:center}
.csw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.csw.sel{box-shadow:0 0 0 2px var(--green);transform:scale(1.12)}
.cpick input[type=color]{width:36px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.stage{flex:1;overflow:auto;background:#dfe6d3;padding:22px;min-height:0}
.stage svg{display:block;box-shadow:0 4px 18px rgba(0,0,0,.15);touch-action:none}
.hint{padding:6px 12px;font-size:12.5px;color:var(--dim);background:var(--panel);border-top:1px solid var(--line);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hint b{color:var(--text)}
.legend{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.cur{font-weight:700;color:var(--green)}
.modal-ov{position:fixed;inset:0;background:rgba(20,18,12,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal{background:var(--panel);border-radius:16px;border:1px solid var(--line);box-shadow:0 14px 44px rgba(0,0,0,.32);width:100%;max-width:340px;padding:18px}
.modal h3{margin:0 0 12px;font-size:17px;color:var(--green)}
.modal h3:empty{display:none}
.modal-body label{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin-bottom:11px}
.modal-body input,.modal-body select,.modal-body textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
.modal-body textarea{resize:vertical;min-height:84px;line-height:1.4}
.modal-body p{margin:0;font-size:14.5px;color:var(--text);line-height:1.45}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.mbtn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:#efe9db;color:var(--text);border-radius:10px;padding:10px 15px;cursor:pointer}
.mbtn:active{transform:scale(.97)}
.mbtn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.mbtn.primary.danger{background:var(--danger);border-color:var(--danger)}
@media (max-width:720px){
  header{gap:7px}
  .selbar{padding:7px 10px}
  .plantsel{max-width:none}
  .dropdown{left:10px;width:calc(100% - 20px)}
}
</style>
</head>
<body>
<header>
  <h1>🌱 GardenMap</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <div class="toolbar">
    <button id="tPlant" class="on">🌿 Plant</button>
    <button id="tErase">🧽 Erase</button>
    <button id="tFence">🚧 Fence</button>
    <span class="sep"></span>
    <button id="fit" title="Fit to view">⤢ Fit</button>
    <button id="zoomOut">➖</button>
    <input type="range" id="zoom" min="3" max="34" step="1">
    <button id="zoomIn">➕</button>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="size">📐 Property</button>
    <button id="png">🖼</button>
    <button id="save">💾</button>
    <button id="clear">🗑</button>
  </div>
</header>
<main>
  <div class="stage-wrap">
    <div class="selbar">
      <span class="lbl">Plant</span>
      <button id="plantSel" class="plantsel"></button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="hint">
      <span id="curWrap"><span class="cur" id="cur">—</span></span>
      <span class="legend" id="legend"></span>
    </div>
    <div id="dropdown" class="dropdown hidden">
      <div class="dd-search"><input id="ddSearch" type="text" placeholder="Search plants & varieties…"></div>
      <div class="dd-list" id="ddList"></div>
      <div class="dd-foot"><button id="addPlant">＋ Add plant / variety</button></div>
    </div>
  </div>
</main>
<input type="file" id="file" accept="application/json" style="display:none">

<script>
const KEY='gardenmap-v1';
const SNAP=6;            // inches — snap grid
const PAD=28;           // px ruler gutter
const COLORS=['#e23b3b','#ff7a1a','#f2c200','#9bd13a','#3a9d3a','#1f8a4c','#1f9e89','#3b82d6','#4b6cb7','#7b4fa3','#c0397b','#e26ab0','#8a5a2b','#b9893f','#6b7280','#2c2a22'];
const CATS=['Veggies','Berries & Vines','Trees','Other'];

const PRESETS=[
  // Veggies
  ['Tomato','🍅',24,'#e23b3b','Veggies'], ['Pepper','🌶️',18,'#e0671f','Veggies'],
  ['Cucumber','🥒',18,'#3a9d3a','Veggies'], ['Zucchini','🥬',36,'#5fae3a','Veggies'],
  ['Squash','🎃',36,'#e8961e','Veggies'], ['Beans','🫘',18,'#8a5a2b','Veggies'],
  ['Peas','🟢',18,'#6cb33f','Veggies'], ['Lettuce','🥗',12,'#7bc043','Veggies'],
  ['Broccoli','🥦',18,'#2f8f4e','Veggies'], ['Cabbage','🥬',24,'#6fae54','Veggies'],
  ['Onion','🧅',6,'#c9a24b','Veggies'], ['Carrot','🥕',3,'#f08a24','Veggies'],
  ['Potato','🥔',12,'#b9893f','Veggies'], ['Corn','🌽',12,'#e8c33a','Veggies'],
  ['Pumpkin','🎃',48,'#e8761e','Veggies'], ['Melon','🍉',48,'#d8463f','Veggies'],
  // Berries & vines
  ['Strawberry','🍓',12,'#e23b5a','Berries & Vines'], ['Blueberry','🫐',60,'#4b6cb7','Berries & Vines'],
  ['Raspberry','🍇',36,'#c0397b','Berries & Vines'], ['Blackberry','🍇',48,'#3a2a4d','Berries & Vines'],
  ['Grape','🍇',96,'#7b4fa3','Berries & Vines'], ['Rhubarb','🌿',36,'#b03a4a','Berries & Vines'],
  ['Asparagus','🌱',18,'#6cae54','Berries & Vines'],
  // Trees
  ['Apple','🍎',240,'#dd3333','Trees'], ['Pear','🍐',240,'#8aa83a','Trees'],
  ['Peach','🍑',180,'#f0a04b','Trees'], ['Cherry','🍒',200,'#b5283b','Trees'],
  ['Plum','🌳',180,'#6b3fa0','Trees'], ['Fruit Tree','🌳',200,'#3f8f4e','Trees'],
  // Other
  ['Mushroom Log','🍄',36,'#a0522d','Other'], ['Herb','🌿',12,'#4caf50','Other'],
  ['Flower','🌸',12,'#e26ab0','Other'],
];

function freshDefaults(){
  return {
    propW:200*12, propL:240*12, zoom:4,
    fences:[{id:uid(), x:30*12, y:30*12, w:30*12, h:70*12}],
    plants:PRESETS.map(([name,em,sp,c,cat])=>({id:uid(),name,em,sp,c,cat})),
    beds:[],
  };
}

let state, selId, tool='plant', selFence=null, fresh=false;
let undoStack=[], drag=null, fenceEls={};
let bedEls=[], plantDrag=null, pan=null, suppressClick=false;

function uid(){ return 'p'+Math.random().toString(36).slice(2,9); }
function plantById(id){ return state.plants.find(p=>p.id===id); }
function fenceById(id){ return state.fences.find(f=>f.id===id); }
function snap(v){ return Math.round(v/SNAP)*SNAP; }
function ppi(){ return state.zoom/12; }
function fmtSp(i){ return i%12===0 ? (i/12)+'′' : i+'″'; }
function fmtFt(i){ const f=i/12; return (Math.round(f*10)/10)+'′'; }

function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) state=JSON.parse(raw); }catch(e){}
  if(!state){ state=freshDefaults(); fresh=true; }
  migrate();
  if(!selId && state.plants[0]) selId=state.plants[0].id;
}
function migrate(){
  // bring older saves (single fixed 30x70 garden) up to the property+fence model
  if(state.fences===undefined){
    const gw=state.gardenW||360, gl=state.gardenL||840;
    state.fences=[{id:uid(), x:0, y:0, w:gw, h:gl}];
    state.propW=Math.max(gw, 200*12);
    state.propL=Math.max(gl, 240*12);
  }
  if(state.propW===undefined) state.propW=200*12;
  if(state.propL===undefined) state.propL=240*12;
  state.plants.forEach(p=>{ if(!p.id)p.id=uid(); if(!p.cat)p.cat='Other'; });
  if(!state.beds) state.beds=[];
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

/* ---------- plant selector bar + dropdown ---------- */
let ddOpen=false;
function escapeHtml(s){ return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hex6(c){ return /^#([0-9a-f]{3})$/i.test(c) ? '#'+c.slice(1).split('').map(x=>x+x).join('') : c; }
function pickNewColor(){ return COLORS[state.plants.length % COLORS.length]; }

function renderSelbar(){
  const b=document.getElementById('plantSel'); const p=plantById(selId);
  b.innerHTML = p
    ? `<span class="em">${p.em}</span><span class="dot" style="background:${p.c}"></span><span class="nm">${escapeHtml(p.name)}</span><span class="sp">${fmtSp(p.sp)}</span><span class="car">▾</span>`
    : `<span class="nm">No plants — add one</span><span class="car">▾</span>`;
}
function openDropdown(){ ddOpen=true; document.getElementById('dropdown').classList.remove('hidden'); renderDropdown(); }
function closeDropdown(){ ddOpen=false; document.getElementById('dropdown').classList.add('hidden'); }
function toggleDropdown(){ ddOpen?closeDropdown():openDropdown(); }
function renderDropdown(){
  const list=document.getElementById('ddList'); list.innerHTML='';
  const q=(document.getElementById('ddSearch').value||'').trim().toLowerCase();
  CATS.forEach(cat=>{
    const items=state.plants.filter(p=>p.cat===cat && (!q||p.name.toLowerCase().includes(q)));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='dd-cat'; h.textContent=cat; list.appendChild(h);
    items.forEach(p=>{
      const row=document.createElement('div'); row.className='prow'+(p.id===selId?' sel':'');
      row.innerHTML=`<span class="em">${p.em}</span><span class="dot" style="background:${p.c}"></span>
        <span class="nm">${escapeHtml(p.name)}</span><span class="sp">${fmtSp(p.sp)}</span>
        <button class="act" title="Edit / rename / recolor" data-edit="${p.id}">✎</button>
        <button class="act" title="Delete" data-del="${p.id}">🗑</button>`;
      row.onclick=e=>{ if(e.target.closest('[data-edit]')||e.target.closest('[data-del]'))return; selId=p.id; closeDropdown(); setTool('plant'); };
      list.appendChild(row);
    });
  });
  if(!list.children.length){ const d=document.createElement('div'); d.className='dd-cat'; d.textContent='No matches'; list.appendChild(d); }
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); plantModal(plantById(b.dataset.edit)); });
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); deletePlant(b.dataset.del); });
}
async function deletePlant(id){
  const p=plantById(id); if(!p) return;
  const used=state.beds.filter(x=>x.p===id).length;
  if(used && !(await confirmModal(`Remove "${escapeHtml(p.name)}"? ${used} placed item(s) of this variety will also be removed.`,'Remove'))) return;
  state.plants=state.plants.filter(x=>x.id!==id); state.beds=state.beds.filter(x=>x.p!==id);
  if(selId===id) selId=state.plants[0]?.id;
  render(); if(ddOpen) renderDropdown();
}

/* add / edit a plant variety (name + emoji + color + spacing + category) */
function colorPickerHTML(current){
  const sw=COLORS.map(c=>`<button type="button" class="csw" data-c="${c}" style="background:${c}"></button>`).join('');
  return `<div class="cpick">${sw}<input type="color" id="mColor" value="${hex6(current)}"></div>`;
}
function wireColor(root){
  const inp=root.querySelector('#mColor'); if(!inp) return;
  const mark=()=>root.querySelectorAll('.csw').forEach(b=>b.classList.toggle('sel', b.dataset.c.toLowerCase()===inp.value.toLowerCase()));
  root.querySelectorAll('.csw').forEach(b=>b.onclick=()=>{ inp.value=b.dataset.c; mark(); });
  inp.oninput=mark; mark();
}
async function plantModal(plant){
  closeDropdown();
  const isEdit=!!plant;
  const cur=plant||{name:'',em:'🌱',sp:24,c:pickNewColor(),cat:'Other'};
  const opts=CATS.map(c=>`<option ${c===cur.cat?'selected':''}>${c}</option>`).join('');
  const actions=[{label:'Cancel',val:null}];
  if(isEdit) actions.push({label:'Delete',val:'del',danger:true});
  actions.push({label:isEdit?'Save':'Add',val:'ok',primary:true});
  const r=await openModal(isEdit?'Edit variety':'Add plant / variety',
    `<label>Name / variety<input id="mN" type="text" value="${escapeAttr(cur.name)}" placeholder="e.g. Red Bell Pepper"></label>
     <label>Emoji / symbol<input id="mE" type="text" value="${escapeAttr(cur.em)}" maxlength="4"></label>
     <label>Marker color${colorPickerHTML(cur.c)}</label>
     <label>Spacing (inches)<input id="mS" type="number" min="1" inputmode="numeric" value="${cur.sp}"></label>
     <label>Category<select id="mC">${opts}</select></label>`,
    actions, wireColor);
  if(r.val==='del'){ await deletePlant(plant.id); return; }
  if(r.val!=='ok') return;
  const name=(r.root.querySelector('#mN').value||'').trim(); if(!name) return;
  const em=(r.root.querySelector('#mE').value||'').trim()||'🌱';
  const c=r.root.querySelector('#mColor').value;
  const sp=Math.min(600,Math.max(1,Math.round(+r.root.querySelector('#mS').value||24)));
  const cat=r.root.querySelector('#mC').value, fc=CATS.includes(cat)?cat:'Other';
  if(isEdit){ Object.assign(plant,{name,em,sp,c,cat:fc}); }
  else { const id=uid(); state.plants.push({id,name,em,sp,c,cat:fc}); selId=id; }
  setTool('plant');
}

/* per-plant journal: tap a placed plant (in Plant tool) to add a planted date + notes */
async function notesModal(idx){
  const b=state.beds[idx]; if(!b) return; const p=plantById(b.p);
  const r=await openModal(`${p?p.em+' '+escapeHtml(p.name):'Plant'} — notes`,
    `<label>Planted<input id="nDate" type="date" value="${escapeAttr(b.planted||'')}"></label>
     <label>Notes (variety, fertilizing schedule, etc.)<textarea id="nNotes" rows="6" placeholder="e.g. Started from seed 5/12 · fertilize every 2 wks · loves this spot">${escapeHtml(b.notes||'')}</textarea></label>`,
    [{label:'Cancel',val:null},{label:'Delete plant',val:'del',danger:true},{label:'Save',val:'ok',primary:true}]);
  if(r.val==='del'){ pushUndo(); state.beds.splice(idx,1); render(); return; }
  if(r.val!=='ok') return;
  pushUndo();
  b.planted=r.root.querySelector('#nDate').value||'';
  b.notes=r.root.querySelector('#nNotes').value||'';
  render();
}

/* ---------- stage ---------- */
const NS='http://www.w3.org/2000/svg';
function E(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function rect(x,y,w,h,fill){ return E('rect',{x,y,width:w,height:h,fill}); }
function line(x1,y1,x2,y2,stroke,w){ return E('line',{x1,y1,x2,y2,stroke,'stroke-width':w}); }
function circle(cx,cy,r,fill){ return E('circle',{cx,cy,r,fill}); }
function txt(x,y,s,size,fill,anchor){ const t=E('text',{x,y,'font-size':size,'text-anchor':anchor||'start','font-family':'-apple-system,Segoe UI,sans-serif'}); if(fill)t.setAttribute('fill',fill); t.textContent=s; return t; }

function renderStage(){
  const stage=document.getElementById('stage');
  const z=state.zoom, pin=ppi();
  const wFt=state.propW/12, lFt=state.propL/12;
  const W=wFt*z, L=lFt*z;
  const svg=E('svg',{width:W+PAD*2, height:L+PAD*2, viewBox:`0 0 ${W+PAD*2} ${L+PAD*2}`});

  svg.appendChild(rect(0,0,W+PAD*2,L+PAD*2,'#dfe6d3'));        // outside-property (grass)
  svg.appendChild(rect(PAD,PAD,W,L,'#e7e0cf'));               // property ground

  // adaptive grid — line + label spacing step down as you zoom in (floor 6")
  const STEPS=[0.5,1,2,5,10,20,50,100,200];                 // feet; 0.5 = 6" minimum
  const pick=minPx=>{ for(const s of STEPS) if(s*z>=minPx) return s; return STEPS[STEPS.length-1]; };
  const minor=pick(9);                                       // grid line spacing
  const label=Math.max(minor, pick(34));                     // labeled (bold) spacing
  const isMult=(ft,step)=> Math.abs(ft/step-Math.round(ft/step))<1e-6;
  const gcol=ft=> isMult(ft,label)?'#a8966c' : (isMult(ft,1)?'#c7ba98':'#dacfb4');
  const gw=ft=> isMult(ft,label)?1.4 : (isMult(ft,1)?0.85:0.5);
  const g=E('g',{});
  for(let i=0,ft=0; ft<=wFt+1e-6; i++,ft=i*minor){ const x=PAD+ft*z; g.appendChild(line(x,PAD,x,PAD+L,gcol(ft),gw(ft))); }
  for(let i=0,ft=0; ft<=lFt+1e-6; i++,ft=i*minor){ const y=PAD+ft*z; g.appendChild(line(PAD,y,PAD+W,y,gcol(ft),gw(ft))); }
  svg.appendChild(g);
  const fmtL=ft=> Math.abs(ft-Math.round(ft))<1e-6 ? Math.round(ft)+'′' : Math.round(ft*12)+'″';
  for(let i=0,ft=0; ft<=wFt+1e-6; i++,ft=i*label) svg.appendChild(txt(PAD+ft*z, PAD-10, fmtL(ft),10,'#5e5847','middle'));
  for(let i=0,ft=0; ft<=lFt+1e-6; i++,ft=i*label) svg.appendChild(txt(PAD-7, PAD+ft*z+3, fmtL(ft),10,'#5e5847','end'));

  // fences (drawn under plants so plant markers stay visible)
  fenceEls={};
  state.fences.forEach(f=> drawFence(svg,f,f.id===selFence));

  // plants — each wrapped in a <g> so it can be dragged (translate) without a full re-render
  const pg=E('g',{}); bedEls=[];
  state.beds.forEach((b,idx)=>{ const p=plantById(b.p); if(!p)return;
    const cx=PAD+b.x*pin, cy=PAD+b.y*pin, r=Math.max(2.5,(p.sp/2)*pin);
    const gg=E('g',{}); if(tool==='plant') gg.style.cursor='move';
    const c=circle(cx,cy,r,p.c); c.setAttribute('fill-opacity','0.22'); c.setAttribute('stroke',p.c); c.setAttribute('stroke-width','1.4'); gg.appendChild(c);
    const dot=circle(cx,cy,Math.min(2.6,r*0.45),p.c); dot.setAttribute('fill-opacity','0.9'); gg.appendChild(dot);
    if(r>=9) gg.appendChild(txt(cx,cy+Math.min(r*0.5,9),p.em,Math.min(r*1.05,22),null,'middle'));
    if(b.notes||b.planted){ const off=Math.max(4,r*0.6); const nb=circle(cx+off,cy-off,3.2,'#e0671f'); nb.setAttribute('stroke','#fff'); nb.setAttribute('stroke-width','1'); gg.appendChild(nb); }
    pg.appendChild(gg); bedEls[idx]=gg;
  });
  svg.appendChild(pg);

  svg.appendChild(E('rect',{x:PAD,y:PAD,width:W,height:L,fill:'none',stroke:'#9a8a63','stroke-width':2}));
  svg.style.cursor = tool==='erase'?'crosshair' : tool==='fence'?'cell' : 'copy';
  svg.addEventListener('pointerdown', onPointerDown);
  svg.addEventListener('click', onClick);

  stage.innerHTML=''; stage.appendChild(svg);
}

function drawFence(svg,f,sel){
  const pin=ppi();
  const x=PAD+f.x*pin, y=PAD+f.y*pin, w=f.w*pin, h=f.h*pin;
  const body=E('rect',{x,y,width:w,height:h,fill:'rgba(90,140,70,0.06)',stroke:sel?'#2f5226':'#5a8c46','stroke-width':sel?2.6:2,'stroke-dasharray':'7 4',rx:2});
  body.dataset.fence=f.id; if(tool==='fence') body.style.cursor='move';
  svg.appendChild(body);
  const lbl=txt(x+5,y+15,`🚧 ${fmtFt(f.w)} × ${fmtFt(f.h)}`,11,'#2f5226','start'); lbl.dataset.fence=f.id;
  svg.appendChild(lbl);
  const handles={};
  if(sel && tool==='fence'){
    const cor={nw:[x,y,'nwse'],ne:[x+w,y,'nesw'],sw:[x,y+h,'nesw'],se:[x+w,y+h,'nwse']};
    for(const k in cor){ const [hx,hy,cur]=cor[k];
      const hd=E('rect',{x:hx-5,y:hy-5,width:10,height:10,fill:'#fff',stroke:'#2f5226','stroke-width':2});
      hd.dataset.handle=k; hd.dataset.fence=f.id; hd.style.cursor=cur+'-resize'; svg.appendChild(hd); handles[k]=hd; }
    // tap-to-delete badge, just inside the top-right corner
    const dx=x+w-14, dy=y+14;
    const dc=E('circle',{cx:dx,cy:dy,r:10,fill:'#c0392b',stroke:'#fff','stroke-width':1.5}); dc.dataset.delfence=f.id; dc.style.cursor='pointer';
    const dt=txt(dx,dy+4,'✕',13,'#fff','middle'); dt.dataset.delfence=f.id; dt.style.cursor='pointer'; dt.style.fontWeight='700';
    svg.appendChild(dc); svg.appendChild(dt);
  }
  fenceEls[f.id]={body,lbl,handles};
}
function updateFenceEls(f){
  const els=fenceEls[f.id]; if(!els) return;
  const pin=ppi(), x=PAD+f.x*pin, y=PAD+f.y*pin, w=f.w*pin, h=f.h*pin;
  Object.assign(els.body.attributes); els.body.setAttribute('x',x); els.body.setAttribute('y',y); els.body.setAttribute('width',w); els.body.setAttribute('height',h);
  els.lbl.setAttribute('x',x+5); els.lbl.setAttribute('y',y+15); els.lbl.textContent=`🚧 ${fmtFt(f.w)} × ${fmtFt(f.h)}`;
  const pos={nw:[x,y],ne:[x+w,y],sw:[x,y+h],se:[x+w,y+h]};
  for(const k in els.handles){ els.handles[k].setAttribute('x',pos[k][0]-5); els.handles[k].setAttribute('y',pos[k][1]-5); }
}

/* ---------- coordinate helper ---------- */
function evToIn(e){
  const svg=document.querySelector('#stage svg'); const r=svg.getBoundingClientRect();
  const scale=r.width/svg.viewBox.baseVal.width;
  return { x:((e.clientX-r.left)/scale-PAD)/ppi(), y:((e.clientY-r.top)/scale-PAD)/ppi() };
}

/* topmost placed plant whose footprint contains (xi,yi), or -1 */
function hitBed(xi,yi){
  for(let i=state.beds.length-1;i>=0;i--){ const b=state.beds[i], p=plantById(b.p); if(!p)continue;
    const dx=b.x-xi, dy=b.y-yi, r=Math.max(p.sp/2,SNAP);
    if(dx*dx+dy*dy<=r*r) return i; }
  return -1;
}

/* ---------- plant place / erase (click) ---------- */
function onClick(e){
  if(suppressClick){ suppressClick=false; return; }   // this click ended a drag/pan
  if(tool==='fence') return;           // fence handled by pointer drag
  const {x:xi,y:yi}=evToIn(e);
  if(xi<0||yi<0||xi>state.propW||yi>state.propL) return;
  if(tool==='erase'){
    const i=hitBed(xi,yi);
    if(i>=0){ pushUndo(); state.beds.splice(i,1); render(); }
    return;
  }
  const p=plantById(selId); if(!p) return;
  pushUndo(); state.beds.push({p:selId,x:snap(xi),y:snap(yi)}); render();
}

/* drag a placed plant to move it; drag empty ground to pan the view */
function onPlantMove(e){
  if(!plantDrag) return;
  const {x:xi,y:yi}=evToIn(e);
  const dpx=(xi-plantDrag.start.x)*ppi(), dpy=(yi-plantDrag.start.y)*ppi();
  if(Math.abs(dpx)+Math.abs(dpy)>2) plantDrag.moved=true;
  const gg=bedEls[plantDrag.idx]; if(gg) gg.setAttribute('transform',`translate(${dpx} ${dpy})`);
}
function onPlantUp(e){
  window.removeEventListener('pointermove',onPlantMove);
  if(plantDrag){
    const idx=plantDrag.idx, b=state.beds[idx];
    if(b && plantDrag.moved){ const {x:xi,y:yi}=evToIn(e); b.x=snap(xi); b.y=snap(yi); suppressClick=true; plantDrag=null; render(); }
    else { undoStack.pop(); suppressClick=true; plantDrag=null; render(); notesModal(idx); }  // a tap = open notes
    return;
  }
  plantDrag=null; render();
}
function startPan(e){
  const st=document.getElementById('stage');
  pan={x:e.clientX,y:e.clientY,sl:st.scrollLeft,st:st.scrollTop,moved:false};
  window.addEventListener('pointermove',onPanMove);
  window.addEventListener('pointerup',onPanUp,{once:true});
}
function onPanMove(e){
  if(!pan) return; const st=document.getElementById('stage');
  const dx=e.clientX-pan.x, dy=e.clientY-pan.y;
  if(Math.abs(dx)+Math.abs(dy)>3) pan.moved=true;
  st.scrollLeft=pan.sl-dx; st.scrollTop=pan.st-dy;
}
function onPanUp(){ window.removeEventListener('pointermove',onPanMove); if(pan&&pan.moved) suppressClick=true; pan=null; }

/* ---------- pointer down: fence tools, plant move, or pan ---------- */
function onPointerDown(e){
  suppressClick=false;                   // clear any stale flag from a prior gesture
  if(tool!=='fence'){
    const {x:xi,y:yi}=evToIn(e);
    if(tool==='plant'){
      const hit=hitBed(xi,yi);
      if(hit>=0){ e.preventDefault(); pushUndo(); plantDrag={idx:hit,start:{x:xi,y:yi},moved:false};
        window.addEventListener('pointermove',onPlantMove); window.addEventListener('pointerup',onPlantUp,{once:true}); return; }
    }
    startPan(e);                         // empty ground (plant tool) or any drag in erase tool → pan
    return;
  }
  e.preventDefault();
  const {x:xi,y:yi}=evToIn(e);
  const t=e.target, fid=t.dataset&&t.dataset.fence, hk=t.dataset&&t.dataset.handle, del=t.dataset&&t.dataset.delfence;
  if(del){ pushUndo(); state.fences=state.fences.filter(x=>x.id!==del); if(selFence===del)selFence=null; render(); return; }
  pushUndo();
  if(hk && selFence===fid){
    drag={mode:'resize',id:fid,handle:hk,start:{x:xi,y:yi},orig:{...fenceById(fid)}};
  }else if(fid){
    selFence=fid; drag={mode:'move',id:fid,start:{x:xi,y:yi},orig:{...fenceById(fid)}}; render();
  }else{
    const f={id:uid(),x:snap(xi),y:snap(yi),w:0,h:0}; state.fences.push(f); selFence=f.id;
    drag={mode:'new',id:f.id,start:{x:xi,y:yi}}; render();
  }
  window.addEventListener('pointermove',onPointerMove);
  window.addEventListener('pointerup',onPointerUp,{once:true});
}
function onPointerMove(e){
  if(!drag) return;
  const {x:xi,y:yi}=evToIn(e);
  const f=fenceById(drag.id); if(!f) return;
  if(drag.mode==='move'){
    f.x=drag.orig.x+(xi-drag.start.x); f.y=drag.orig.y+(yi-drag.start.y);
  }else if(drag.mode==='new'){
    f.x=Math.min(drag.start.x,xi); f.y=Math.min(drag.start.y,yi);
    f.w=Math.abs(xi-drag.start.x); f.h=Math.abs(yi-drag.start.y);
  }else if(drag.mode==='resize'){
    const o=drag.orig, dx=xi-drag.start.x, dy=yi-drag.start.y; const k=drag.handle;
    let x=o.x,y=o.y,w=o.w,h=o.h;
    if(k.includes('w')){ x=o.x+dx; w=o.w-dx; } if(k.includes('e')){ w=o.w+dx; }
    if(k.includes('n')){ y=o.y+dy; h=o.h-dy; } if(k.includes('s')){ h=o.h+dy; }
    f.x=x; f.y=y; f.w=Math.max(12,w); f.h=Math.max(12,h);
  }
  updateFenceEls(f);
}
function onPointerUp(){
  window.removeEventListener('pointermove',onPointerMove);
  if(drag){ const f=fenceById(drag.id);
    if(f){ f.x=snap(f.x); f.y=snap(f.y); f.w=snap(f.w); f.h=snap(f.h);
      if(drag.mode==='new' && (f.w<12||f.h<12)){ state.fences=state.fences.filter(x=>x.id!==f.id); selFence=null; undoStack.pop(); } }
  }
  drag=null; render();
}

/* ---------- misc actions ---------- */
function pushUndo(){ undoStack.push(JSON.stringify({beds:state.beds,fences:state.fences})); if(undoStack.length>80)undoStack.shift(); }
function undo(){ if(!undoStack.length)return; const s=JSON.parse(undoStack.pop()); state.beds=s.beds; state.fences=s.fences; if(!fenceById(selFence))selFence=null; render(); }

function setTool(t){ tool=t; if(t!=='fence') selFence=null; render(); }

function fit(){
  const st=document.getElementById('stage');
  const aw=st.clientWidth-PAD*2-30, ah=st.clientHeight-PAD*2-30;
  const z=Math.floor(Math.min(aw/(state.propW/12), ah/(state.propL/12)));
  state.zoom=Math.max(3,Math.min(34,z||4)); document.getElementById('zoom').value=state.zoom; render();
}
function setZoom(z){ state.zoom=Math.max(3,Math.min(34,z)); document.getElementById('zoom').value=state.zoom; render(); }

/* in-app dialogs — native prompt/confirm/alert are blocked in iOS standalone (Home Screen) apps */
function openModal(title, innerHTML, actions, onMount){
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.className='modal-ov';
    ov.innerHTML=`<div class="modal"><h3>${title}</h3><div class="modal-body">${innerHTML}</div><div class="modal-foot"></div></div>`;
    const foot=ov.querySelector('.modal-foot');
    const done=v=>{ document.removeEventListener('keydown',onKey,true); ov.remove(); resolve({val:v,root:ov}); };
    actions.forEach(a=>{ const b=document.createElement('button'); b.textContent=a.label;
      b.className='mbtn'+(a.primary?' primary':'')+(a.danger?' danger':''); b.onclick=()=>done(a.val); foot.appendChild(b); });
    function onKey(e){ if(e.key==='Escape'){ e.stopPropagation(); done(null); }
      else if(e.key==='Enter' && e.target.tagName!=='SELECT' && e.target.tagName!=='TEXTAREA'){ const p=actions.find(a=>a.primary); if(p){ e.preventDefault(); e.stopPropagation(); done(p.val); } } }
    document.addEventListener('keydown',onKey,true);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov) done(null); });
    document.body.appendChild(ov);
    if(onMount) onMount(ov);
    const f=ov.querySelector('input,select'); if(f){ f.focus(); if(f.select) f.select(); }
  });
}
async function confirmModal(msg, okLabel='OK'){
  const r=await openModal('', `<p>${msg}</p>`, [{label:'Cancel',val:null},{label:okLabel,val:'ok',primary:true,danger:true}]);
  return r.val==='ok';
}
function infoModal(msg){ return openModal('', `<p>${msg}</p>`, [{label:'OK',val:'ok',primary:true}]); }

async function editSize(){
  const r=await openModal('Property size',
    `<label>Width (ft)<input id="mW" type="number" min="1" inputmode="decimal" value="${+(state.propW/12)}"></label>
     <label>Length (ft)<input id="mL" type="number" min="1" inputmode="decimal" value="${+(state.propL/12)}"></label>`,
    [{label:'Cancel',val:null},{label:'Save',val:'ok',primary:true}]);
  if(r.val!=='ok') return;
  const w=parseFloat(r.root.querySelector('#mW').value), l=parseFloat(r.root.querySelector('#mL').value);
  if(!(w>0)||!(l>0)) return;
  state.propW=Math.round(w*12); state.propL=Math.round(l*12); fit();
}
async function saveLoad(){
  const r=await openModal('Backup',
    `<p>Save a JSON backup of your whole map, or load one you saved earlier.</p>`,
    [{label:'Cancel',val:null},{label:'Load file…',val:'load'},{label:'Download backup',val:'save',primary:true}]);
  if(r.val==='save') exportJSON(); else if(r.val==='load') document.getElementById('file').click();
}
async function doClear(){ if(await confirmModal('Remove ALL placed plants? (fences and palette are kept)','Clear plants')){ pushUndo(); state.beds=[]; render(); } }
function exportJSON(){ const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='gardenmap-backup.json'; a.click(); URL.revokeObjectURL(a.href); }
function importJSON(file){ const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.plants&&d.beds){ state=d; migrate(); selId=state.plants[0]?.id; selFence=null; setTool('plant'); } else infoModal('That file is not a GardenMap backup.'); }catch(e){ infoModal('Could not read that file.'); } };
  r.readAsText(file); }
function exportPNG(){ const svg=document.querySelector('#stage svg'); if(!svg)return;
  const xml=new XMLSerializer().serializeToString(svg); const img=new Image();
  img.onload=()=>{ const sc=2, cv=document.createElement('canvas'); cv.width=svg.width.baseVal.value*sc; cv.height=svg.height.baseVal.value*sc;
    const ctx=cv.getContext('2d'); ctx.scale(sc,sc); ctx.drawImage(img,0,0);
    cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='garden-plan.png'; a.click(); URL.revokeObjectURL(a.href); }); };
  img.onerror=()=>infoModal('PNG export failed in this browser — use the JSON backup instead.');
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(xml))); }

/* ---------- top-level render ---------- */
function render(){
  const ac=(state.propW*state.propL/144/43560);
  document.getElementById('meta').textContent=
    `${Math.round(state.propW/12)}′ × ${Math.round(state.propL/12)}′ · ${ac.toFixed(2)} ac · ${state.beds.length} plants · ${state.fences.length} fence${state.fences.length===1?'':'s'}`;
  ['tPlant','tErase','tFence'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById({plant:'tPlant',erase:'tErase',fence:'tFence'}[tool]).classList.add('on');
  document.getElementById('cur').textContent = tool==='erase'?'🧽 Erase — tap a plant to remove it' : tool==='fence'?'🚧 Fence — drag to draw · tap to select · ✕ to delete' : '🌿 Plant — tap to place · drag a plant to move · tap a plant for notes';
  renderSelbar(); if(ddOpen) renderDropdown(); renderStage(); renderLegend(); save();
}
function renderLegend(){
  const counts={}; state.beds.forEach(b=>counts[b.p]=(counts[b.p]||0)+1);
  const el=document.getElementById('legend'); el.innerHTML='';
  const keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(!keys.length){ el.innerHTML='<span style="color:var(--dim)">No plants placed — pick one from the Plant bar above and tap the map. Use 🚧 Fence to draw your enclosure.</span>'; return; }
  keys.forEach(id=>{ const p=plantById(id); if(!p)return; const s=document.createElement('span');
    s.innerHTML=`<i style="background:${p.c}"></i>${p.em} ${p.name} <b>×${counts[id]}</b>`; el.appendChild(s); });
}

/* ---------- wire up ---------- */
load();
document.getElementById('zoom').value=state.zoom;
render();
if(fresh) fit();

document.getElementById('tPlant').onclick=()=>setTool('plant');
document.getElementById('tErase').onclick=()=>setTool('erase');
document.getElementById('tFence').onclick=()=>setTool('fence');
document.getElementById('fit').onclick=fit;
document.getElementById('zoomIn').onclick=()=>setZoom(state.zoom+2);
document.getElementById('zoomOut').onclick=()=>setZoom(state.zoom-2);
document.getElementById('zoom').oninput=e=>setZoom(+e.target.value);
document.getElementById('undo').onclick=undo;
document.getElementById('addPlant').onclick=()=>plantModal(null);
document.getElementById('size').onclick=editSize;
document.getElementById('png').onclick=exportPNG;
document.getElementById('save').onclick=saveLoad;
document.getElementById('file').onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; };
document.getElementById('clear').onclick=doClear;
document.getElementById('plantSel').onclick=toggleDropdown;
document.getElementById('ddSearch').oninput=renderDropdown;
document.addEventListener('mousedown',e=>{ if(ddOpen && !e.target.closest('#dropdown') && !e.target.closest('#plantSel')) closeDropdown(); });

document.addEventListener('keydown',e=>{
  if(document.querySelector('.modal-ov')) return;   // a dialog is open — it owns the keyboard
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); undo(); return; }
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='e'||e.key==='E') setTool(tool==='erase'?'plant':'erase');
  if(e.key==='f'||e.key==='F') setTool(tool==='fence'?'plant':'fence');
  if((e.key==='Delete'||e.key==='Backspace') && tool==='fence' && selFence){ pushUndo(); state.fences=state.fences.filter(x=>x.id!==selFence); selFence=null; render(); }
});
</script>
</body>
